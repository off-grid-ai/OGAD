server {
  listen 80; server_name mail.farm.test;
  root /dev/shm/clone-farm/src/roundcube; index index.php;
  location ~ ^/(config|temp|logs|SQL|bin|installer)/ { deny all; }
  location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/farm.sock; }
}
server {
  listen 80; server_name webmail.farm.test;
  root /dev/shm/clone-farm/src/snappymail; index index.php;
  location ^~ /data { deny all; }
  location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/farm.sock; }
}
