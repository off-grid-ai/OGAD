server {
  listen 80; server_name docs.farm.test;
  location / {
    proxy_pass http://127.0.0.1:7132; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 3600; proxy_buffering off;
  }
}
