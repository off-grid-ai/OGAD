server {
  listen 80; server_name wiki.farm.test;
  root /dev/shm/clone-farm/wiki-www/public; index index.php;
  client_max_body_size 50m;
  location / { try_files $uri $uri/ /index.php?$query_string; }
  location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/farm.sock; }
}
