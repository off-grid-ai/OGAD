server {
  listen 80; server_name board.farm.test;
  root /dev/shm/clone-farm/src/kanboard; index index.php;
  location ~ ^/(data|config\.php|app|libs|vendor|tests)(/|$) { deny all; }
  location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/farm.sock; }
}
