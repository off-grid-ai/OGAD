server {
  listen 80; server_name forum.farm.test;
  client_max_body_size 20m;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http;
  location ~ ^/(api|pictrs|feeds|nodeinfo|\.well-known) { proxy_pass http://127.0.0.1:7141; }
  location / { proxy_pass http://127.0.0.1:7142; }
}
