# Akkoma on social.farm.test. Akkoma's session cookie is built at compile time as "__Host-pleroma_key; secure",
# which Chrome drops on plain http. Rename it on the way out and back on the way in.
map $upstream_http_set_cookie $social_set_cookie {
  "~^__Host-pleroma_key=(?<v>[^;]*)" "social_key=$v; path=/; HttpOnly; SameSite=Lax";
  default $upstream_http_set_cookie;
}
map $http_cookie $social_cookie {
  "~(?<a>.*)social_key=(?<b>.*)" "${a}__Host-pleroma_key=$b";
  default $http_cookie;
}
server {
  listen 80; server_name social.farm.test;
  client_max_body_size 40m;
  # The Mastodon web UI (mastodon-fe) routes at the root (/home, /@nick, /tags/x...) but Akkoma serves its
  # page only under /web: hand those paths the /web page, the client router does the rest.
  location ~ ^/(home|public|notifications|explore|search|tags|favourites|bookmarks|lists|conversations|directory|follow_requests|blocks|mutes|start|publish|statuses/new|timelines|getting-started|followed_tags|pinned|accounts|@[^/]+)(/.*)?$ {
    rewrite ^ /web/home break;
    proxy_pass http://127.0.0.1:7140;
    proxy_http_version 1.1;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Cookie $social_cookie;
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $social_set_cookie always;
  }
  # Akkoma lacks featured tags; the web UI shows an error toast on every profile without this.
  location ~ ^/api/v1/accounts/[^/]+/featured_tags$ { default_type application/json; return 200 '[]'; }
  location / {
    proxy_pass http://127.0.0.1:7140;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Cookie $social_cookie;
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $social_set_cookie always;
  }
}
