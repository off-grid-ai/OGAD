server {
  listen 80; server_name people.farm.test;
  root /dev/shm/clone-farm/src/humhub; index index.php;
  client_max_body_size 64m;
  location ~ ^/(protected|themes/\w+/views|uploads/file) { deny all; }
  location / { try_files $uri $uri/ /index.php?$args; }
  location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/farm.sock; }
}
