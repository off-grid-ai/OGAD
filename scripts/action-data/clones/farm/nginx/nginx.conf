worker_processes 8;
pid /workspace/clone-farm/run/nginx-master.pid;
error_log /workspace/clone-farm/logs/nginx-error.log;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_max_body_size 512m;
  proxy_read_timeout 300;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /workspace/clone-farm/nginx/sites/*.conf;
}
