APP_NAME = Farm Git
RUN_MODE = prod
RUN_USER = gitea
WORK_PATH = /dev/shm/clone-farm/gitea

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 7121
DOMAIN = git.farm.test
ROOT_URL = http://git.farm.test/
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /dev/shm/clone-farm/gitea/data/gitea.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = /dev/shm/clone-farm/gitea/repos

[security]
INSTALL_LOCK = true
SECRET_KEY = farm-test-secret-key-not-real
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE3MDAwMDAwMDB9.farmfarmfarmfarmfarmfarmfarmfarmfarmfarmfarm
PASSWORD_HASH_ALGO = pbkdf2_hi
MIN_PASSWORD_LENGTH = 6
PASSWORD_COMPLEXITY = off

[oauth2]
ENABLED = false

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = false

[mailer]
ENABLED = false

[session]
PROVIDER = file
PROVIDER_CONFIG = /dev/shm/clone-farm/gitea/sessions

[log]
MODE = console
LEVEL = Warn
ROOT_PATH = /dev/shm/clone-farm/gitea/log

[indexer]
ISSUE_INDEXER_TYPE = db
REPO_INDEXER_ENABLED = false

[cron]
ENABLED = false

[cron.update_checker]
ENABLED = false

[api]
ENABLE_SWAGGER = false
MAX_RESPONSE_ITEMS = 100
DEFAULT_PAGING_NUM = 50

[ui]
DEFAULT_THEME = gitea-light

[actions]
ENABLED = false

[other]
SHOW_FOOTER_VERSION = false
SHOW_FOOTER_POWERED_BY = false
SHOW_FOOTER_TEMPLATE_LOAD_TIME = false
