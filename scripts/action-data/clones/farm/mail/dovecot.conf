# Clone-farm IMAP + LMTP. Mail lives in /dev/shm (fast reset from the seed snapshot).
protocols = imap lmtp
listen = 127.0.0.1
base_dir = /run/dovecot-farm
state_dir = /dev/shm/clone-farm/dovecot-state
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /var/log/dovecot-farm.log
mail_location = maildir:/dev/shm/clone-farm/mail/%d/%n/Maildir
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
default_internal_user = dovecot
default_login_user = dovenull
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /workspace/clone-farm/mail/users.passwd
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/dev/shm/clone-farm/mail/%d/%n
}
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 143
  }
}
service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
