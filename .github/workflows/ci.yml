# PR + main verification: typecheck (core + pro), the full vitest suite (which includes the pro/ tests
# when the pro repo is checked out alongside), the DB journeys, the heavy integration tests,
# dependency boundaries, lint, the native recording journeys, and the new-code coverage report across
# all of them. The optional Playwright e2e tour runs beside them when OFFGRID_CI_E2E is set.
#
# Cross-repo note: pro/ is a separate private repo (paid features). Set the repo
# secret CI_CROSS_REPO_TOKEN (a PAT with read access to off-grid-ai/desktop-pro)
# so the pro tests + pro typecheck run here too.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# Read-only token: the jobs read code, their own run's jobs and artifacts, and write nothing back.
permissions:
  contents: read
  actions: read

# A new push to a pull request replaces its running checks, which would otherwise hold runners for a
# commit nobody will merge. Pushes to main each finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every gate as a parallel job on one shared setup (.github/actions/setup-desktop).
  #
  # This was ONE job for a reason worth keeping: an earlier verify + e2e split duplicated the pro and
  # shared checkouts and a second `npm ci`, and the copies were the bug. The setup now lives once and
  # every job calls it. Run in one job, the gates took 37 minutes, 16 of them the vitest suite alone;
  # here the suite is split into four shards balanced by recorded file run time
  # (scripts/config/vitest-duration-sequencer.ts).
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: a hung step fails fast instead of running for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: checks, name: 'types, boundaries, lint' }
          - { task: unit, shard: 1, name: 'vitest (1/4)' }
          - { task: unit, shard: 2, name: 'vitest (2/4)' }
          - { task: unit, shard: 3, name: 'vitest (3/4)' }
          - { task: unit, shard: 4, name: 'vitest (4/4)' }
          - { task: db, name: 'DB journeys' }
          - { task: heavy, name: 'heavy integration' }
    steps:
      - uses: actions/checkout@v4
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}

      # ── checks. Each runs even when an earlier one failed, so one red gate cannot hide the rest.
      - name: Typecheck (core)
        if: ${{ !cancelled() && matrix.task == 'checks' }}
        timeout-minutes: 6
        run: npm run typecheck
      - name: Typecheck (pro)
        if: ${{ !cancelled() && matrix.task == 'checks' }}
        timeout-minutes: 6
        run: cd pro && npx tsc --noEmit -p tsconfig.json
      # Architecture-boundary gate (hygiene §A/§H): walks the import graph and fails on a forbidden
      # edge - core->pro (open-core), a pure-logic module gaining an IO import, renderer->main,
      # circular deps.
      - name: Dependency boundaries
        if: ${{ !cancelled() && matrix.task == 'checks' }}
        timeout-minutes: 4
        run: npm run depcruise
      # NOTE: SonarCloud runs via Automatic Analysis (SonarCloud clones this repo and analyzes core
      # on each push/PR - no CI step, token, or coverage upload here).
      - name: Lint
        if: ${{ !cancelled() && matrix.task == 'checks' }}
        timeout-minutes: 8
        run: npm run lint

      # ── unit: a quarter of the product suite, by run time.
      #
      # npm's Electron install hooks leave sqlite compiled for Electron's ABI. The Vitest process is
      # plain Node, and some default integration tests open the real database, so put the native
      # module on Node's ABI first.
      - name: Rebuild SQLite for the Node test runner
        if: ${{ matrix.task == 'unit' }}
        run: npm rebuild better-sqlite3-multiple-ciphers
      # The fast report, not the complete coverage measurement: the coverage job merges every shard
      # with the DB, heavy and native reports. Test failures still block here.
      - name: Test + coverage (shard ${{ matrix.shard }}/4)
        id: unit
        if: ${{ matrix.task == 'unit' }}
        # V8 maps coverage across the complete core + Pro source set, including files no test
        # imported, which can take several minutes on a busy runner.
        timeout-minutes: 20
        env:
          OFFGRID_AGGREGATE_COVERAGE: '1'
          SHARD: ${{ matrix.shard }}
        run: >-
          npm run test:coverage -- --shard="$SHARD/4" --coverage.reportsDirectory="coverage-unit-$SHARD"
          --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-results.json"
      - name: Upload the shard's coverage
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: coverage-unit-${{ matrix.shard }}/coverage-final.json
          retention-days: 1
      # The meeting recorder worker's own V8 output (integration-tests/meeting-recorder-worker.test.ts),
      # written by whichever shard runs that file.
      - name: Upload the native recording worker coverage
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: coverage-native-raw-${{ matrix.shard }}
          path: coverage-native-raw/
          if-no-files-found: ignore
          retention-days: 1
      # Each file's run time, to refresh scripts/config/vitest-timings.json
      # (scripts/update-vitest-timings.mjs).
      - name: Upload the shard's file times
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: vitest-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-results.json
          retention-days: 14

      # ── db: the DB journeys - 74 files, 255 cases - against the real native SQLite.
      #
      # They are excluded from the default vitest project because they load the real native SQLite
      # and need better-sqlite3-multiple-ciphers rebuilt for the TEST RUNNER's node ABI.
      # scripts/test-db.sh does that swap and restores Electron's build afterwards.
      #
      # OFFGRID_DB_VITEST_CONFIG selects the CI variant: the coverage variant ("the db journeys that
      # pass today", each skip documented in vitest.db.coverage.config.ts) plus four files that fail
      # on a LINUX runner rather than in the code, each reason recorded in vitest.db.ci.config.ts.
      - name: DB journeys (real native SQLite)
        id: db
        if: ${{ matrix.task == 'db' }}
        timeout-minutes: 12
        env:
          OFFGRID_DB_VITEST_CONFIG: vitest.db.ci.config.ts
        run: npm run test:db -- --coverage
      - name: Upload the DB coverage
        if: ${{ !cancelled() && steps.db.outcome != 'skipped' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: coverage-db
          path: coverage-db/coverage-final.json
          retention-days: 1

      # ── heavy: build/native/port integration tests (packaging, whisper build-staging, the
      # model-port + System Health seams that own :8439), against synthetic profiles and external
      # native boundaries. The gateway, Team mode and model-port seams are tested here and nowhere else.
      - name: Heavy integration (build/native/port)
        id: heavy
        if: ${{ matrix.task == 'heavy' }}
        timeout-minutes: 15
        run: |
          # These tests run in Node; restore Electron's SQLite ABI again before the worker test.
          trap 'npx electron-rebuild -f -w better-sqlite3-multiple-ciphers' EXIT
          npm explore better-sqlite3-multiple-ciphers -- npm run build-release
          OFFGRID_AGGREGATE_COVERAGE=1 npm run test:heavy -- --coverage --coverage.reportsDirectory=coverage-heavy
      - name: Upload the heavy coverage
        if: ${{ !cancelled() && steps.heavy.outcome != 'skipped' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: coverage-heavy
          path: coverage-heavy/coverage-final.json
          retention-days: 1

  # The full Playwright tour on the BUILT app. OFF BY DEFAULT since 2026-08-11: it was advisory, so it
  # never gated anything, and it spent up to 28 minutes of every run to say so. The suite runs on a
  # real macOS display through `scripts/e2e-on-box.sh`, where its failures are actionable (a Linux
  # runner cannot satisfy a fixture that needs Pro's macOS-only native layer).
  #
  # Set the repository variable OFFGRID_CI_E2E=1 to turn it back on - no code change needed. It then
  # runs beside the other jobs, and stays ADVISORY: headless-Electron launch instability on the
  # ubuntu runner (waitForEvent 'window' timeouts, "page/context closed") is not a product failure.
  #
  # OFFGRID_E2E_COVERAGE makes the run count: Node writes V8 coverage for the main process and the
  # vite build emits the sourcemaps that map it back to src/**.ts. c8 turns it into an Istanbul
  # report, which the coverage job takes as --coarse (whole-file denominators, covered lines only).
  e2e:
    name: e2e (advisory)
    if: ${{ vars.OFFGRID_CI_E2E == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
      - name: E2E (Playwright, xvfb)
        timeout-minutes: 28
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          OFFGRID_E2E_COVERAGE: ${{ github.workspace }}/coverage-e2e-raw
        run: xvfb-run -a npm run test:e2e
      - name: Convert e2e coverage
        if: ${{ !cancelled() }}
        run: |
          if [ -d coverage-e2e-raw ] && [ -n "$(ls -A coverage-e2e-raw 2>/dev/null)" ]; then
            npx c8 report --temp-directory=coverage-e2e-raw --reporter=json --reporter=text-summary \
              --report-dir=coverage-e2e --all=false
          else
            echo "no e2e coverage captured (the suite may not have launched)"
          fi
      - name: Upload e2e coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: e2e-coverage
          path: coverage-e2e/
          if-no-files-found: ignore
      - name: Upload e2e screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  native-desktop:
    name: Native recording (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
          speech-binary: 'false'
          python-version: ${{ runner.os == 'Windows' && '3.12' || '' }}
      # The release's Windows Whisper, saved on main's push (see release-caches below).
      - name: Windows Vulkan Whisper
        if: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' }}
        uses: ./.github/actions/windows-whisper
        with:
          save: 'true'
          lookup-only: 'true'
      - name: Install the virtual Linux desktop and media runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pulseaudio pulseaudio dbus-x11 openbox xdotool x11-utils ffmpeg xvfb
      - name: Record on the synthetic Linux desktop
        if: runner.os == 'Linux'
        env:
          OFFGRID_NATIVE_DESKTOP_TEST: '1'
          XDG_SESSION_TYPE: x11
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=offgrid_test
            pactl set-default-sink offgrid_test
            pactl set-default-source offgrid_test.monitor
            openbox >/tmp/offgrid-openbox.log 2>&1 &
            npx vitest run integration-tests/native-desktop-recording.test.ts integration-tests/extension-bridge-native.test.ts integration-tests/extension-chat-native.test.ts integration-tests/chat-next-action-native.test.ts integration-tests/task-stop-native.test.ts integration-tests/web-use-failure-native.test.ts integration-tests/web-use-debugger-native.test.ts --no-file-parallelism --project product-integration
          '
      - name: Record on the synthetic Windows desktop
        if: runner.os == 'Windows'
        env:
          OFFGRID_NATIVE_DESKTOP_TEST: '1'
        run: npx vitest run integration-tests/native-desktop-recording.test.ts integration-tests/extension-bridge-native.test.ts integration-tests/extension-chat-native.test.ts integration-tests/chat-next-action-native.test.ts integration-tests/task-stop-native.test.ts integration-tests/web-use-failure-native.test.ts integration-tests/web-use-debugger-native.test.ts --no-file-parallelism --project product-integration
      - name: Verify chat queues and saved replies in Electron
        if: runner.os == 'Linux'
        timeout-minutes: 18 # 16 specs take ~11.7 min on ubuntu-latest; 12 left no headroom
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        # These specs use fresh free profiles and synthetic model executables.
        # They need neither a license nor the macOS-only Pro capture layer.
        run: xvfb-run -a npm run test:e2e -- e2e/chat-queue-versions.spec.ts e2e/app093-image-generation-persistence.spec.ts --workers=1
      - name: Upload chat UI test evidence
        if: ${{ failure() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-ui-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Convert native source coverage
        run: |
          node scripts/convert-native-coverage.mjs coverage-native-desktop-raw coverage-native-desktop
          node scripts/normalize-native-coverage.mjs coverage-native-desktop/coverage-final.json relative
      - uses: actions/upload-artifact@v4
        with:
          name: native-desktop-coverage-${{ matrix.os }}
          path: coverage-native-desktop/coverage-final.json
          if-no-files-found: error

  # The heavy builds a release restores (.github/actions/macos-*, windows-whisper). A release runs
  # on dispatch and writes no cache, so main's push saves them here, and the first beta after a
  # merge restores them instead of building cold. Each looks up its key without downloading and
  # builds only on a miss, so a push that changed none of them costs one setup.
  release-caches:
    name: Release caches (macOS)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
          speech-ref: d005e3509e6f608bb4e70abbe9f089120a08e973 # the release's ExecuTorch 1.5.1
          speech-binary: 'false'
      - name: macOS image engine
        uses: ./.github/actions/macos-image-engine
        with:
          save: 'true'
          lookup-only: 'true'
      - name: macOS speech runtime
        uses: ./.github/actions/macos-speech-runtime
        with:
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          speech-ref: d005e3509e6f608bb4e70abbe9f089120a08e973
          save: 'true'
          lookup-only: 'true'

  # The new-code coverage report across every suite. It starts with the others and sets up while
  # they run, then waits for them, so its setup is not added to the wall clock.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The report compares the change with this PR's base branch. A depth-1 checkout has no
          # merge base to measure.
          fetch-depth: 0
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
          fetch-depth: '0'
      # Every other job except the final `ci` gate. A job that failed still uploaded what coverage it
      # had; its failure is the `ci` gate's to report.
      - name: Wait for the test jobs
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name != \"coverage\" and .name != \"ci\") | select(.status != \"completed\")] | length"
          }
          # A failed API call is not "done": wait until it returns a real zero.
          while true; do
            pending="$(jobs || true)"
            if [[ "$pending" =~ ^[0-9]+$ ]] && [ "$pending" -eq 0 ]; then break; fi
            sleep 15
          done
      - name: Download the coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Download native desktop source coverage
        uses: actions/download-artifact@v4
        with:
          pattern: native-desktop-coverage-*
          path: coverage-native-desktop
      - name: Download e2e coverage
        if: ${{ vars.OFFGRID_CI_E2E == '1' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
          path: coverage-e2e
      # c8 turns the worker's raw V8 output into an Istanbul report. It lives in the shared
      # monorepo's node_modules and needs no new dependency here.
      - name: Convert native recording worker coverage
        run: |
          mkdir -p coverage-native-raw
          cp coverage-reports/coverage-native-raw-*/* coverage-native-raw/
          node ../shared/node_modules/c8/bin/c8.js report --temp-directory=coverage-native-raw \
            --reporter=json --reporter=text-summary --report-dir=coverage-native --all=false
          test -f coverage-native/coverage-final.json
      - name: Normalize native source paths
        run: |
          for report in coverage-native-desktop/*/coverage-final.json; do
            node scripts/normalize-native-coverage.mjs "$report" absolute
          done
      # Report only (maintainer's call, 2026-10-21): new-code coverage is printed for the reviewer but
      # never blocks a merge. Total coverage is what is tracked. Every report that can cover this
      # change is merged, then only executable lines added on this branch are measured; the floors
      # are the same ratchets as scripts/hooks/pre-push.
      - name: Coverage report (new code across all suites)
        run: |
          reports="coverage-reports/coverage-unit-1/coverage-final.json coverage-reports/coverage-unit-2/coverage-final.json coverage-reports/coverage-unit-3/coverage-final.json coverage-reports/coverage-unit-4/coverage-final.json coverage-reports/coverage-db/coverage-final.json coverage-reports/coverage-heavy/coverage-final.json coverage-native-desktop/native-desktop-coverage-ubuntu-latest/coverage-final.json coverage-native-desktop/native-desktop-coverage-windows-2022/coverage-final.json"
          for report in $reports; do
            if [ ! -f "$report" ]; then
              echo "::error::required coverage report is missing: $report"
              exit 1
            fi
          done
          coarse="--coarse=coverage-native/coverage-final.json"
          if [ -f coverage-e2e/coverage-final.json ]; then
            coarse="$coarse --coarse=coverage-e2e/coverage-final.json"
          fi
          node ../shared/scripts/new-code-coverage.mjs . $reports $coarse
          node ../shared/scripts/new-code-coverage.mjs ./pro $reports $coarse

  # One check to read, and the name the single job had: green only when every gate above is. The
  # e2e tour is advisory and not part of it.
  ci:
    needs: [test, native-desktop, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
