# PR + main verification, as ONE job: typecheck (core + pro), the full vitest suite with the coverage floor
# (which includes the pro/ tests when the pro repo is checked out alongside), dependency boundaries, lint, and
# the Playwright e2e tour on the built app.
#
# Cross-repo note: pro/ is a separate private repo (paid features). Set the repo
# secret CI_CROSS_REPO_TOKEN (a PAT with read access to off-grid-ai/desktop-pro)
# so the pro tests + pro typecheck run here too. Without it, core is still fully
# verified and the pro steps are skipped gracefully.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # ONE job per repo, matching mobile and mobile-pro: typecheck, tests + coverage, boundaries, lint and the
  # Playwright e2e all report as a single `ci` check.
  #
  # This used to be two parallel jobs (verify + e2e). Merging them costs ~7 minutes of wall clock - the e2e tour
  # now runs after the unit gates instead of beside them - and buys one check to read instead of two, plus the
  # deletion of a duplicated pro + shared checkout and a second `npm ci` that existed only to feed the second
  # job. An earlier attempt at this was reverted because appending e2e "blew the 25-min job cap" (PR #68); that
  # cap was this workflow's own timeout-minutes, so it is raised here deliberately rather than worked around.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # backstop: a hung step fails fast instead of running for hours (unit gates + e2e tour)
    # Each gate below uses !cancelled() so later checks still report after an earlier failure.
    # Required failures still make this job fail; only the marked advisory steps can fail without blocking.
    steps:
      - uses: actions/checkout@v4
        with:
          # The authoritative coverage gate compares the checked-out change with
          # this PR's base branch. A depth-1 checkout has no merge base to measure.
          fetch-depth: 0
      # Check out pro on the branch that MATCHES this PR/push (so a coordinated
      # core+pro change is tested together). If pro has no such branch (most PRs),
      # this step's checkout fails quietly and the fallback below pulls pro `main`.
      # Without this, CI silently tested the core branch against pro `main`, so
      # pro's new test files were absent while pro source was still measured →
      # coverage cratered (60% vs 97% local). See PR #46.
      - name: Check out pro (matching branch) into ./pro
        id: pro_branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: off-grid-ai/desktop-pro
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: pro
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          # Don't leave the cross-repo PAT in ./pro/.git/config where a later
          # PR-controlled step could reuse it — we only need it for the clone.
          persist-credentials: false
      - name: Fall back to the Pro base branch if no matching branch
        if: ${{ !cancelled() && (steps.pro_branch.outcome != 'success' || hashFiles('pro/tsconfig.json') == '') }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/desktop-pro
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: pro
          ref: ${{ github.base_ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      # pro MUST be present: without it the guarded typecheck/coverage path is skipped and
      # CI would pass core-only with cratered/misleading coverage (the failure the
      # matching-branch checkout above was added to fix). Fail loudly instead of silently.
      - name: Require pro checkout to have succeeded
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f pro/tsconfig.json ]; then
            echo "::error::pro (desktop-pro) was not checked out — cannot validate the open-core build. Check CI_CROSS_REPO_TOKEN / repo access."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          # Node 22 supports node:sqlite and both native SQLite dependencies. Node
          # 24 aborts while Vitest unloads the cipher module; Node 26 cannot build
          # better-sqlite3 12.6.
          node-version: '22'
      # Shared packages are file: dependencies on the SIBLING shared monorepo. CI must provision it before
      # installing Desktop. actions/checkout refuses a path outside the workspace, so it lands inside and is
      # moved up one level - exactly where the file: specifiers point.
      #
      # Matching branch first, main as the fallback, the same shape as the pro checkout above: a PR that changes
      # the app and the shared package together must be tested against the package it expects.
      - name: Check out the shared monorepo
        if: ${{ !cancelled() }}
        id: shared_branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - name: Fall back to the Shared base branch
        if: ${{ !cancelled() && steps.shared_branch.outcome != 'success' }}
        id: shared_base
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          ref: ${{ github.base_ref || 'main' }}
          persist-credentials: false
      - name: Fall back to Shared main
        if: ${{ !cancelled() && steps.shared_branch.outcome != 'success' && steps.shared_base.outcome != 'success' }}
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          ref: main
          persist-credentials: false
      - name: Put shared beside this checkout
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f _shared/package-lock.json ]; then
            echo "::error::off-grid-ai/shared was not checked out - shared packages cannot resolve. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../shared
          mv _shared ../shared
          # Install at the WORKSPACE ROOT, not inside packages/sync. shared is an npm-workspaces
          # monorepo: the lockfile and the build tool (tsup) live at the root, and packages/sync
          # declares neither. Installing inside the member failed `npm ci` (no lockfile there), fell
          # through to `npm install`, pulled the member's five runtime deps, and left the build to
          # die on `sh: 1: tsup: not found` (exit 127), taking both jobs with it.
          # A LOCKED install, and no fallback: an unlocked install would resolve a different graph and let the
          # later gates run against dependencies nobody committed. A drifted lock should stop the build.
          npm --prefix ../shared ci
          npm --prefix ../shared/packages/sync run build
          npm --prefix ../shared/packages/models run build
          npm --prefix ../shared/packages/speech run build
          npm --prefix ../shared/packages/ui run build
      - name: Check out the private Desktop speech runtime
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _executorch_speech
          lfs: false
          # Keep the checkout credential only until the selective LFS pull in
          # the next step. That step removes it before any project code runs.
          persist-credentials: true
      - name: Put the speech runtime beside this checkout
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f _executorch_speech/package.json ]; then
            echo "::error::off-grid-ai/executorch-speech was not checked out. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          # Tests exercise the real native boundary, but ordinary CI does not need
          # the 350 MB bundled English asset set used only by the Mac release.
          git -C _executorch_speech lfs pull --include='native/bin/executorch-speech' --exclude=''
          git -C _executorch_speech config --unset-all http.https://github.com/.extraheader || true
          rm -rf ../executorch-speech
          mv _executorch_speech ../executorch-speech
      - if: ${{ !cancelled() }}
        run: npm ci
      # Hard gates: types + the full test suite.
      - name: Typecheck (core)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: npm run typecheck
      - name: Typecheck (pro)
        if: ${{ !cancelled() && hashFiles('pro/tsconfig.json') != '' }}
        timeout-minutes: 6
        run: cd pro && npx tsc --noEmit -p tsconfig.json
      # npm's Electron install hooks leave sqlite compiled for Electron's ABI. The
      # Vitest process is plain Node, and some default integration tests open the
      # real database, so put the native module on Node's ABI before that gate.
      # The later DB journey script restores the Electron ABI in its EXIT trap.
      - name: Rebuild SQLite for the Node test runner
        if: ${{ !cancelled() }}
        run: npm rebuild better-sqlite3-multiple-ciphers
      # This is the fast report, not the complete coverage measurement. DB-only
      # journeys run next and e2e can add coarse coverage later. Test failures still
      # block here; the aggregate new-code gate below owns the coverage decision.
      - name: Test + fast coverage report
        if: ${{ !cancelled() }}
        # The tests finish in about four minutes. V8 then maps coverage across the
        # complete core + Pro source set, including files no test imported. That
        # aggregation can take another six minutes on a busy runner, so give report
        # generation enough time to finish.
        timeout-minutes: 20
        env:
          OFFGRID_AGGREGATE_COVERAGE: '1'
        run: npm run test:coverage
      # The DB journeys - 74 files, 255 cases - which CI has NEVER run.
      #
      # They are excluded from the default vitest project because they load the real native SQLite and need
      # better-sqlite3-multiple-ciphers rebuilt for the TEST RUNNER's node ABI (the app builds it for
      # ELECTRON's). scripts/test-db.sh does that swap and restores Electron's build afterwards, which is why
      # this is its own step: the rebuild mutates node_modules.
      #
      # Not running them had a measurable cost. The default config EXCLUDES database.ts, rag/store.ts,
      # prompt-store and runtime-residency with the note "covered by the tests in *.dbtest.ts via
      # npm run test:db" - a claim nothing verified. approval-lifecycle.ts measured 0% for the same reason
      # while having tests all along.
      #
      # OFFGRID_DB_VITEST_CONFIG selects the coverage variant, which is "the db journeys that pass today": it
      # skips four files whose causes are each documented in vitest.db.coverage.config.ts (one of them is the
      # control-center projection bug still awaiting a decision). vitest writes no report at all when any test
      # fails, so the variant is what makes a report possible; the exclusions are visible in that file rather
      # than hidden here, and each is meant to be deleted as its cause is resolved.
      - name: DB journeys (real native SQLite)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          # The CI variant: the coverage variant plus four files that fail on a LINUX runner rather than in the
          # code - a bundled macOS ffmpeg, a live engine port, the update feed, and one still undiagnosed. Each
          # reason is recorded in vitest.db.ci.config.ts with the evidence from the run that found it. 243 of the
          # 248 cases still run here.
          OFFGRID_DB_VITEST_CONFIG: vitest.db.ci.config.ts
        run: npm run test:db -- --coverage
      # Build/native/port integration tests (packaging, whisper build-staging, the
      # model-port + System Health seams that own :8439). These need a packaged
      # build / native toolchain / a live engine port the pure `verify` runner
      # doesn't have. They run here against synthetic profiles and external
      # native boundaries, and failures block this job.
      - name: Heavy integration (build/native/port)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          # The preceding DB journey restores Electron's SQLite ABI. These
          # tests run in Node; restore Electron again before the worker test.
          trap 'npx electron-rebuild -f -w better-sqlite3-multiple-ciphers' EXIT
          npm explore better-sqlite3-multiple-ciphers -- npm run build-release
          npm run test:heavy
      # Architecture-boundary gate (hygiene §A/§H): walks the import graph and fails
      # on a forbidden edge — core->pro (open-core), a pure-logic module gaining an
      # IO import, renderer->main, circular deps. Fast (graph-only, ~2s), so unlike
      # eslint it can BLOCK without wedging CI. Rules verified clean on the tree.
      - name: Dependency boundaries
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: npm run depcruise
      # NOTE: SonarCloud runs via Automatic Analysis (SonarCloud clones this repo and
      # analyzes core on each push/PR — no CI step, token, or coverage upload here).
      # Lint errors block CI. Keep the timeout bounded for the full source tree.
      - name: Lint
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npm run lint
      # The full Playwright tour on the BUILT app - the one check unit/integration cannot give: does the app
      # actually render and drive. Specs needing real models/engine binaries (functional-real-engine, voice/tts)
      # self-skip when those are absent, as they are here, so this gates the model-free surfaces: onboarding,
      # nav, Settings, Models, Replay (incl. the capture toggle), Integrations (BYO Google).
      #
      # Electron needs an X server on Linux; xvfb-run provides a virtual one. --no-sandbox via env (Electron's
      # sandbox cannot run under the CI user without SUID setup).
      #
      # ADVISORY (continue-on-error) for now - same policy as lint and test:heavy above. The remaining reason is
      # headless-Electron launch instability on the ubuntu runner (waitForEvent 'window' timeouts, "page/context
      # closed", clipboard/display-dependent specs), NOT product failures.
      #
      # NOTE: this being advisory hid four real spec defects on main for days (a selector that could never match,
      # a section never opened, two stale accessible names) - the job was green while 7 specs failed. Every one is
      # fixed and the full suite is 73/73 on a real display, so the ONLY thing still standing between this and
      # BLOCKING is runner stability. Steps taken: retries: 2 in CI (playwright.config.ts) for whole-instance
      # launch flakes, and fixed-port specs now self-skip instead of failing (e2e/helpers/ports.ts).
      #
      # Graduate to BLOCKING (delete continue-on-error) once a few consecutive runs are green - do NOT flip it
      # while the runner still drops instances, or the gate gets reverted and we lose the signal again. Tracked
      # in docs/GAPS_BACKLOG.md.
      #
      # OFFGRID_E2E_COVERAGE makes this run COUNT. 25 specs drive the real app - devices-sync alone stands up a
      # synthetic peer with a real SyncEngine - and none of it reached a coverage report before, because
      # Playwright launches Electron as its own process. With the variable set, Node writes V8 coverage for the
      # main process and the vite build emits the sourcemaps that map it back to src/**.ts; both are gated on this
      # variable, so a normal run and every shipped artifact are byte-identical to before.
      #
      # OFF BY DEFAULT since 2026-08-11. It was advisory, so it never gated anything, and it spent up to
      # 28 minutes of every run to say so. The suite now runs on a real macOS display through
      # `scripts/e2e-on-box.sh`, which is where its failures are actionable: the specs added on 2026-08-09
      # pass there and fail here, because a Linux runner cannot satisfy a fixture that needs Pro's
      # macOS-only native layer.
      #
      # Set the repository variable OFFGRID_CI_E2E=1 to turn it back on - no code change needed. Do not
      # make it blocking on this runner; read the note above first.
      - name: E2E (Playwright, xvfb)
        if: ${{ !cancelled() && vars.OFFGRID_CI_E2E == '1' }}
        timeout-minutes: 28
        continue-on-error: true
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          OFFGRID_E2E_COVERAGE: ${{ github.workspace }}/coverage-e2e-raw
        run: xvfb-run -a npm run test:e2e
      # c8 turns the raw V8 output into an Istanbul report. It lives in the shared monorepo's node_modules and
      # needs no new dependency here.
      #
      # The report is a build ARTIFACT rather than a gate: its statement map comes from the bundle, so its
      # denominators are whole-file and must not set a threshold - see shared/scripts/merge-line-coverage.mjs,
      # which accepts it as --coarse and lets it contribute covered lines only.
      - name: Convert e2e coverage
        if: ${{ !cancelled() && vars.OFFGRID_CI_E2E == '1' }}
        continue-on-error: true
        run: |
          if [ -d coverage-e2e-raw ] && [ -n "$(ls -A coverage-e2e-raw 2>/dev/null)" ]; then
            npx c8 report --temp-directory=coverage-e2e-raw --reporter=json --reporter=text-summary \
              --report-dir=coverage-e2e --all=false
          else
            echo "no e2e coverage captured (the suite may not have launched)"
          fi
      - name: Convert native recording worker coverage
        if: ${{ !cancelled() }}
        run: |
          node ../shared/node_modules/c8/bin/c8.js report --temp-directory=coverage-native-raw \
            --reporter=json --reporter=text-summary --report-dir=coverage-native --all=false
          test -f coverage-native/coverage-final.json
      # Match the pre-push authority: merge every report that can cover this change,
      # then gate only executable lines added on this branch. The floors are the same
      # ratchets as scripts/hooks/pre-push; neither whole-tree debt nor a partial suite
      # can decide the result.
      - name: Wait for native desktop coverage
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 48); do
            completed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("Native recording (")) | select(.status == "completed")] | length')
            if [ "$completed" -eq 2 ]; then
              failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name | startswith("Native recording (")) | select(.conclusion != "success")] | length')
              test "$failed" -eq 0
              break
            fi
            sleep 15
          done
          test "$completed" -eq 2
      - name: Download native desktop source coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          pattern: native-desktop-coverage-*
          path: coverage-native-desktop
      - name: Normalize native source paths
        if: ${{ !cancelled() }}
        run: |
          for report in coverage-native-desktop/*/coverage-final.json; do
            node scripts/normalize-native-coverage.mjs "$report" absolute
          done
      - name: Coverage gate (new code across all suites)
        if: ${{ !cancelled() }}
        run: |
          reports="coverage/coverage-final.json coverage-db/coverage-final.json coverage-native-desktop/native-desktop-coverage-ubuntu-latest/coverage-final.json coverage-native-desktop/native-desktop-coverage-windows-2022/coverage-final.json"
          for report in $reports; do
            if [ ! -f "$report" ]; then
              echo "::error::required coverage report is missing: $report"
              exit 1
            fi
          done
          coarse="--coarse=coverage-native/coverage-final.json"
          if [ -f coverage-e2e/coverage-final.json ]; then
            coarse="$coarse --coarse=coverage-e2e/coverage-final.json"
          fi
          node ../shared/scripts/new-code-coverage.mjs . $reports $coarse \
            --min-statements=78 --min-branches=57 --min-functions=52 --min-lines=78
          node ../shared/scripts/new-code-coverage.mjs ./pro $reports $coarse \
            --min-statements=72 --min-branches=45 --min-functions=46 --min-lines=72
      - name: Upload e2e coverage
        if: ${{ !cancelled() && vars.OFFGRID_CI_E2E == '1' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: e2e-coverage
          path: coverage-e2e/
          if-no-files-found: ignore
      - name: Upload e2e screenshots
        if: ${{ !cancelled() && vars.OFFGRID_CI_E2E == '1' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  native-desktop:
    name: Native recording (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        id: native_pro_branch
        continue-on-error: true
        with:
          repository: off-grid-ai/desktop-pro
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: pro
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.native_pro_branch.outcome != 'success'
        with:
          repository: off-grid-ai/desktop-pro
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: pro
          ref: ${{ github.base_ref || 'main' }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _executorch_speech
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Install workspace dependencies
        run: |
          mv _shared ../shared
          mv _executorch_speech ../executorch-speech
          npm --prefix ../shared ci
          for package in models sync use automation speech ui; do
            npm --prefix "../shared/packages/$package" run build
          done
          npm ci
      - name: Install the virtual Linux desktop and media runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pulseaudio pulseaudio dbus-x11 openbox xdotool x11-utils ffmpeg xvfb
      - name: Record on the synthetic Linux desktop
        if: runner.os == 'Linux'
        env:
          OFFGRID_NATIVE_DESKTOP_TEST: '1'
          XDG_SESSION_TYPE: x11
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=offgrid_test
            pactl set-default-sink offgrid_test
            pactl set-default-source offgrid_test.monitor
            openbox >/tmp/offgrid-openbox.log 2>&1 &
            npx vitest run integration-tests/native-desktop-recording.test.ts --project product-integration
          '
      - name: Record on the synthetic Windows desktop
        if: runner.os == 'Windows'
        env:
          OFFGRID_NATIVE_DESKTOP_TEST: '1'
        run: npx vitest run integration-tests/native-desktop-recording.test.ts --project product-integration
      - name: Convert native source coverage
        run: |
          node scripts/convert-native-coverage.mjs coverage-native-desktop-raw coverage-native-desktop
          node scripts/normalize-native-coverage.mjs coverage-native-desktop/coverage-final.json relative
      - uses: actions/upload-artifact@v4
        with:
          name: native-desktop-coverage-${{ matrix.os }}
          path: coverage-native-desktop/coverage-final.json
          if-no-files-found: error
