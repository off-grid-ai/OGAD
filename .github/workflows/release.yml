name: Build and Release

on:
  # MANUAL ONLY. A merge to main no longer auto-builds — we trigger releases on demand so a
  # merge never spends a build or moves the beta feed on its own. Run it from
  # Actions → Build and Release → Run workflow, and pick the channel:
  #   beta   = nightly opt-in feed (default; an accidental run can never ship stable to everyone)
  #   stable = everyone
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel — beta = nightly opt-in feed; stable = everyone'
        type: choice
        options: [beta, stable]
        default: beta
      pro_ref:
        # Default to the Pro commit pinned by the selected Core source.
        description: 'desktop-pro branch/tag/sha (empty = commit pinned by Core)'
        type: string
        required: false
        default: ''
      artifact_only:
        # Internal demo build: the SAME signed + notarized DMG, but uploaded as a run
        # artifact (repo-scoped, auto-expiring) instead of a published Release. Skips the
        # release-create/upload, the pro-mac.yml + latest/nightly aliases, Slack, and the
        # Windows and Linux jobs - so nothing lands on the releases page or the update feed.
        description: 'Build the signed+notarized DMG as a run artifact only (no Release, no Windows or Linux, no Slack)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# ONE signed + notarized DMG: the macOS build bundles the private pro
# source (cloned from off-grid-ai/desktop-pro) and is license-gated at runtime —
# free = unlicensed (pro tabs locked), a valid Keygen key unlocks in place (no
# re-download). The ASAR integrity fuse (electron-builder.yml) makes a tampered
# app.asar refuse to load — our local-first anti-tamper lever (we don't phone home).
# Actions are pinned to commit SHAs. macOS, Windows, and Linux share the one
# `version` job and publish to the same release. Each platform stages its own
# native engine; the Linux package currently contains the core product.
jobs:
  # Resolve the channel + version. STABLE (manual promote) bumps the patch and
  # commits it so main tracks the released version; BETA (every merge) stamps a
  # throwaway -beta.<run> version WITHOUT committing, so nightly builds never move
  # main's base version or spam it with bump commits.
  version:
    # Manual-only trigger, so this always runs on dispatch; the old push/[skip ci] guard is gone.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      channel: ${{ steps.bump.outputs.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve channel + version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.channel }}" = "stable" ]; then
            CHANNEL=stable
            VERSION=$(node -p "require('./package.json').version")
            # A deliberately prepared version (for example 0.0.39) ships as-is.
            # Only advance when that exact version already has a release tag.
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              npm version patch --no-git-tag-version
              VERSION=$(node -p "require('./package.json').version")
              git add package.json package-lock.json
              git commit -m "chore: bump version to $VERSION [skip ci]"
              git push
            fi
          else
            CHANNEL=beta
            # A nightly is a prerelease of the NEXT patch, so it sorts ABOVE the last
            # stable, not below it: 0.0.35 stable -> 0.0.36-beta.<run> (NOT
            # 0.0.35-beta.<run>, which semver ranks BELOW 0.0.35 and would read as a
            # downgrade). The -beta suffix marks the GitHub release as a prerelease;
            # the update feed itself is always latest-mac.yml (no publish.channel set).
            # No commit.
            BASE=$(node -p "require('./package.json').version")
            BASE=${BASE%%-*}
            NEXT=$(node -e "const p='$BASE'.split('.').map(Number); console.log(p[0]+'.'+p[1]+'.'+(p[2]+1))")
            VERSION="${NEXT}-beta.${{ github.run_number }}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pin the build to THIS exact commit, not floating main.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create draft release for parallel platform builds
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          CHANNEL: ${{ steps.bump.outputs.channel }}
          TARGET_SHA: ${{ steps.bump.outputs.sha }}
        run: |
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$TARGET_SHA" \
              --title "Off Grid AI Desktop $VERSION" --notes 'Build in progress.'
          fi
          if [ "$CHANNEL" = beta ] && ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title 'Nightly (rolling)' \
              --notes 'Rolling nightly build. Pre-release.'
          fi

  # Single build: pro code bundled, license-gated. Publishes to the default update
  # channel (latest-mac.yml).
  build-mac:
    needs: version
    runs-on: macos-15 # Standard arm64 runner; matches the pinned native payload.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.sha }} # the exact bumped commit
          fetch-depth: 0
          lfs:
            false # Smudge nothing on checkout; pull only the shipped, non-rebuilt
            # binaries below. Fetching everything (~200 MB) blew the org's monthly LFS
            # bandwidth budget and failed the release checkout ("exceeded its LFS budget").
      - name: Pull shipped LFS binaries
        run: git lfs pull --exclude="resources/bin/llama,resources/bin/llama-prism,resources/bin/whisper,resources/bin/kev-runtime"
      - name: Stage pinned macOS native engines
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/mac-native.tar.gz" \
            'https://github.com/off-grid-ai/OGAD/releases/download/native-deps-2026-09/ogad-mac-native-2026-09-arm64-v1.tar.gz'
          echo 'ef1880daac727595bf825a254b1ebbc2a0c15c0cecd8da422c499b1568db0ad0  '"$RUNNER_TEMP/mac-native.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/mac-native.tar.gz" -C resources/bin
      - name: Verify cached macOS engines
        run: |
          for variant in llama llama-prism; do
            test -x "resources/bin/$variant/llama-server"
            minos=$(otool -l "resources/bin/$variant/llama-server" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            test -n "$minos"
            case "$minos" in 1[0-3].*|[1-9].*) ;; *) echo "Unsupported $variant minos $minos" >&2; exit 1 ;; esac
            DYLD_LIBRARY_PATH="resources/bin/$variant" "resources/bin/$variant/llama-server" --help >/dev/null
          done
          test -x resources/bin/whisper/whisper-cli
          otool -l resources/bin/whisper/whisper-cli | grep -q LC_BUILD_VERSION
          DYLD_LIBRARY_PATH=resources/bin/whisper resources/bin/whisper/whisper-cli --help >/dev/null
      # Compile the native meeting recorder (ScreenCaptureKit + AVFoundation) and stage
      # it into resources/bin so extraResources bundles it at Contents/Resources/bin —
      # the first path recorderBin() resolves in the packaged app (pro meeting-native.ts).
      # Built fresh against the pinned macOS 13 target (NOT the committed dev copy), and
      # signed automatically by the electron-builder pass. Without this the binary is
      # never staged into the .app and packaged users hit "Meeting recorder binary not
      # found" — same class of bug as the un-pinned/un-staged engine failures above.
      - name: Build meeting recorder (native ScreenCaptureKit helper)
        run: |
          bash scripts/build-meeting-recorder.sh
          mkdir -p resources/bin
          cp scripts/meeting-recorder/meeting-recorder resources/bin/meeting-recorder
          chmod +x resources/bin/meeting-recorder
          file resources/bin/meeting-recorder
          otool -l resources/bin/meeting-recorder | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "[ci] meeting-recorder minos="$2; exit}'
      - name: Build Computer Use capture helper (exclude supervisor window)
        run: |
          MACOS_DEPLOYMENT_TARGET=13.0 bash scripts/build-computer-use-capture.sh resources/bin
          chmod +x resources/bin/computer-use-capture
          file resources/bin/computer-use-capture
          otool -l resources/bin/computer-use-capture | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "[ci] computer-use-capture minos="$2; exit}'
      # Compile the dictation push-to-talk helper (CGEventTap) and stage it into
      # resources/bin so extraResources bundles it at Contents/Resources/bin — the
      # path PushToTalkHotkey resolves. Self-contained: no committed binary, built
      # fresh against the pinned target. If this ever fails to ship, dictation
      # simply falls back to tap-to-toggle (globalShortcut), so it can't break a release.
      - name: Build dictation hotkey helper (push-to-talk)
        run: |
          bash scripts/build-dictation-hotkey.sh
          mkdir -p resources/bin
          cp scripts/dictation-hotkey/dictation-hotkey resources/bin/dictation-hotkey
          chmod +x resources/bin/dictation-hotkey
      # Compile the native actions helper (EventKit) and stage it into resources/bin so
      # extraResources bundles it at Contents/Resources/bin — the path runNativeAction
      # resolves. Self-contained: no committed binary, built fresh against the pinned
      # target. If it ever fails to ship, the calendar tools report "not available" and
      # the rest of the app is unaffected, so it can't break a release.
      - name: Build native actions helper (computer use, semantic rail)
        run: |
          bash scripts/build-actions-helper.sh
          mkdir -p resources/bin
          cp scripts/actions-helper/actions-helper resources/bin/actions-helper
          chmod +x resources/bin/actions-helper
      - name: Verify macOS Kev runtime
        run: |
          resources/bin/kev-runtime/python/bin/python3 -c 'import kev, mlx_lm, torch, uvicorn'
          resources/bin/kev-runtime/python/bin/python3 resources/bin/kev-local-server.py --help >/dev/null
      # Stage the Parakeet STT runtime (sherpa-onnx CLI + ONNX model) into
      # resources/bin/parakeet. Additive: with SHERPA_ONNX_URL / PARAKEET_MODEL_URL
      # unset this is a no-op and transcription stays on whisper, so it can't break a
      # release. Set those vars once the exact sherpa-onnx build + Parakeet export are pinned.
      - name: Stage Parakeet STT runtime (optional)
        env:
          SHERPA_ONNX_URL: ${{ vars.SHERPA_ONNX_URL }}
          PARAKEET_MODEL_URL: ${{ vars.PARAKEET_MODEL_URL }}
        run: bash scripts/fetch-parakeet.sh
      # Private pro source into pro/ → __OFFGRID_PRO__ true. The checkout action
      # injects the token as an http.extraheader (never in a clone URL) and scrubs
      # it afterwards — safer than embedding ${TOKEN} in a git URL.
      - name: Resolve pinned Pro source
        id: pro_source
        shell: bash
        env:
          PRO_BUILD_REF: ${{ inputs.pro_ref }}
        run: bash scripts/resolve-build-pro-ref.sh
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/desktop-pro
          ref: ${{ steps.pro_source.outputs.ref }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro
          fetch-depth: 1
      - name: Drop nested .git from pro/
        run: rm -rf pro/.git # don't nest a repo inside the build tree
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      # Shared packages are file: dependencies on the shared monorepo, so it must sit BESIDE this
      # checkout before `npm ci` runs - an install cannot resolve a path that does not exist, and the
      # bundle then fails on imports from it. `ci.yml` has done this since
      # the sync work landed; this workflow did not, which is why no release has built since 2026-07-30.
      #
      # The release ref decides the shared ref: a release from `main` takes shared `main`, and a release
      # from an integration branch takes the branch of the same name when one exists.
      - name: Checkout shared at the matching ref
        id: shared_branch
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: ${{ github.ref_name }}
          path: _shared
          persist-credentials: false
      - name: Fall back to shared main
        if: ${{ steps.shared_branch.outcome != 'success' }}
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false
      - name: Put shared beside this checkout
        run: |
          if [ ! -d _shared ]; then
            echo "::error::off-grid-ai/shared was not checked out - shared packages cannot resolve. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../shared
          mv _shared ../shared
          # Install at the WORKSPACE ROOT: shared is an npm-workspaces monorepo whose lockfile and
          # build tool live at the root, and packages/sync declares neither. A locked install, so a
          # drifted lock stops the release instead of resolving a graph nobody committed.
          npm --prefix ../shared ci
          npm --prefix ../shared/packages/sync run build
          # @offgrid/use (the durable action engine) is consumed the same way as sync
          # and needs the same explicit build - file-dep prepare alone does not emit
          # its dist/ output before the app bundle runs.
          npm --prefix ../shared/packages/use run build
          npm --prefix ../shared/packages/automation run build
          npm --prefix ../shared/packages/models run build
          npm --prefix ../shared/packages/speech run build
          npm --prefix ../shared/packages/ui run build
      - name: Check out the private Desktop speech runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _executorch_speech
          lfs: true # Mac releases bundle the default English voices for offline first use.
          persist-credentials: false
      - name: Put the speech runtime beside this checkout
        run: |
          if [ ! -f _executorch_speech/package.json ]; then
            echo "::error::off-grid-ai/executorch-speech was not checked out. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../executorch-speech
          mv _executorch_speech ../executorch-speech
      - name: Install dependencies
        run: npm ci
      # Stamp the resolved version into package.json so electron-builder picks the
      # right channel. For stable this matches the committed bump (no-op); for beta
      # it applies the -beta.<run> version (no commit needed — this checkout is
      # throwaway). The -beta suffix marks the release prerelease; the feed stays
      # latest-mac.yml (electron-builder emits no beta-mac.yml without publish.channel).
      - name: Stamp build version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Stage native files and bundle
        run: node scripts/stage-native.mjs && npx electron-vite build
      # The version job has already created this build's draft tag. Exclude it
      # when finding the previous release for the changelog.
      - name: Generate release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 \
            --exclude="v${{ needs.version.outputs.version }}" \
            --exclude=nightly 2>/dev/null || echo "")
          node scripts/release-notes.mjs \
            "$LAST_TAG" \
            "${{ needs.version.outputs.version }}" \
            "${{ github.repository }}" \
            > release-notes.md
          cat release-notes.md
      - name: Package, sign, notarize & verify (publication disabled)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.version.outputs.version }}
          OFFGRID_REQUIRE_RELEASE_TRUST: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Signing walks the bundled Kev/PyTorch runtime in parallel. The macOS
          # runner's default soft limit can make electron-builder fail with EMFILE.
          HARD_OPEN_FILE_LIMIT=$(ulimit -Hn)
          if [ "$HARD_OPEN_FILE_LIMIT" = "unlimited" ] || [ "$HARD_OPEN_FILE_LIMIT" -gt 65536 ]; then
            HARD_OPEN_FILE_LIMIT=65536
          fi
          ulimit -n "$HARD_OPEN_FILE_LIMIT"
          # notarytool needs the API key as a file; write it from the secret.
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run prepare:speech-defaults
          # Build every artifact with publication disabled. The artifact hook verifies
          # both the updater ZIP and DMG before this command can complete.
          npx electron-builder --mac \
            -c.dmg.artifactName='OffGrid-${version}.${ext}' \
            --publish never
          # electron-builder notarizes the app before it creates the DMG. Submit the
          # completed, signed DMG too, then staple its ticket for offline Gatekeeper.
          DMG="dist/OffGrid-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$DMG"
          codesign --verify --strict --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          # Stapling changes the DMG bytes. Refresh the blockmap and update feed before upload.
          node scripts/refresh-mac-dmg-update-info.mjs "$DMG" dist/latest-mac.yml
          APP="$(find dist -maxdepth 2 -type d -name 'Off Grid AI Desktop.app' -print -quit)"
          test -n "$APP"
          test -s "$APP/Contents/Resources/performance-packs.json"
          node scripts/probe-packaged-tts.mjs "$APP" --synthesize
      # Internal demo build: hand the signed+notarized DMG back as a run artifact and stop
      # (the publish steps below are all skipped). Repo-scoped, auto-expiring, no Release.
      - name: Upload signed DMG as a build artifact
        if: ${{ inputs.artifact_only }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: OffGrid-macOS-${{ needs.version.outputs.version }}
          path: dist/OffGrid-*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Stage verified update assets and publish the release
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          # electron-builder writes ONE update feed, latest-mac.yml, for BOTH channels
          # (we set no publish.channel, so it never emits beta-mac.yml). Beta vs stable
          # is expressed by the release's prerelease flag + electron-updater's
          # allowPrerelease on the client, NOT by a distinct feed filename — every
          # shipped beta used latest-mac.yml (e.g. 0.0.39-beta.66), and the pro-mac.yml
          # migration below copies from latest-mac.yml on the beta path too. A prior
          # refactor assumed a beta-mac.yml that is never generated, so `test -f` aborted
          # every nightly publish under `set -e` with no output.
          FEED=latest-mac.yml
          test -f "dist/$FEED"
          node scripts/prepare-mac-release-assets.mjs \
            "dist/$FEED" dist dist/release-assets "$VERSION"

          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/release-assets/* --clobber
          if [ "$CHANNEL" = stable ]; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease
          fi
      - name: Migrate legacy Pro update channel (publish pro-mac.yml)
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          # Older Pro builds poll a SEPARATE channel (pro-mac.yml); publish a copy
          # on EVERY build (stable + nightly) so legacy Pro installs see updates on
          # both channels and are never orphaned. Stable points at the versioned
          # release; nightly points at the rolling 'nightly' pre-release tag.
          if [ "$CHANNEL" = "stable" ]; then
            cp dist/latest-mac.yml dist/pro-mac.yml
            gh release upload "v$VERSION" dist/pro-mac.yml --clobber
          else
            # Nightly: upload alongside the rolling nightly tag so legacy Pro beta
            # testers also get the freshest build.
            cp dist/latest-mac.yml dist/pro-mac.yml
            gh release upload nightly dist/pro-mac.yml --clobber
          fi
      # Stable "always latest" download link. The versioned DMG (OffGrid-<v>.dmg)
      # changes name every release, so /releases/latest/download/<name> can't target
      # it. Upload a constant-named COPY so this URL is permanent across releases:
      #   https://github.com/off-grid-ai/OGAD/releases/latest/download/OffGrid-latest.dmg
      # --clobber replaces the copy from the prior run. The versioned DMG + updater
      # feed (latest-mac.yml) are untouched, so auto-update is unaffected.
      - name: Publish stable latest.dmg alias
        if: ${{ !inputs.artifact_only && needs.version.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "dist/OffGrid-$VERSION.dmg" dist/OffGrid-latest.dmg
          gh release upload "v$VERSION" dist/OffGrid-latest.dmg --clobber
      # Constant nightly download link. /releases/latest EXCLUDES pre-releases, so it
      # can never point at a beta build (that is exactly what keeps the STABLE link
      # safe). Nightly therefore gets its own fixed-tag 'nightly' release whose dmg is
      # force-replaced every beta build — a permanent, SEPARATE URL that never touches
      # /releases/latest or the stable OffGrid-latest.dmg:
      #   https://github.com/off-grid-ai/OGAD/releases/download/nightly/OffGrid-nightly.dmg
      - name: Publish constant nightly.dmg link
        if: ${{ !inputs.artifact_only && needs.version.outputs.channel == 'beta' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "dist/OffGrid-$VERSION.dmg" dist/OffGrid-nightly.dmg
          # Ensure the rolling 'nightly' pre-release exists (kept separate from the
          # versioned -beta.N releases electron-builder makes for the updater feed),
          # then clobber its dmg so the link always serves the freshest nightly.
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly (rolling)" \
              --notes "Rolling nightly build, auto-updated on every change. Pre-release — expect rough edges. Stable: https://github.com/off-grid-ai/OGAD/releases/latest"
          gh release upload nightly dist/OffGrid-nightly.dmg --clobber
      # electron-builder creates the GitHub release with empty notes; attach the notes
      # generated above. Runs for BOTH channels (beta + stable) — the notes file and the
      # v$VERSION tag exist for beta too, so beta/nightly releases get their changelog on
      # the release page, not just stable.
      - name: Attach release notes
        if: ${{ !inputs.artifact_only && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --notes-file release-notes.md

  # Windows release build. Mirrors build-mac: it consumes the SAME resolved version
  # + channel from the `version` job and publishes the NSIS installer plus the
  # Windows electron-updater feed (latest.yml for stable, beta.yml for nightly) to
  # the SAME GitHub release, so Windows and macOS ship as one version with working
  # auto-update. The version job creates the draft release first, so all platform
  # builds can upload to it in parallel. Windows native runtimes are fetched by scripts/fetch-win-binaries.ps1
  # (the repo's LFS binaries are macOS-only).
  build-win:
    needs: version
    # Skipped for an artifact-only demo build (macOS DMG is all the lead needs).
    if: ${{ !inputs.artifact_only }}
    # windows-2022 = VS 2022 toolchain. windows-latest ships VS 2026, which node-gyp 11
    # can't parse, breaking native-module (better-sqlite3) compiles. Pin until it catches up.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.sha }} # the exact bumped commit, same as build-mac
          lfs: false # Pull only the cross-platform Kev launcher below, not the macOS LFS binaries
          persist-credentials: false # don't leave the token in .git/config for npm postinstall scripts
      - name: Pull the Kev server launcher from LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="resources/bin/kev-local-server.py" --exclude=""
          if head -n 1 resources/bin/kev-local-server.py | grep -q '^version https://git-lfs.github.com/spec/'; then
            echo "::error::Kev server launcher is still an LFS pointer"
            exit 1
          fi
      - name: Resolve pinned Pro source
        id: pro_source
        shell: bash
        env:
          PRO_BUILD_REF: ${{ inputs.pro_ref }}
        run: bash scripts/resolve-build-pro-ref.sh
      - name: Check out private pro source into pro/
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/desktop-pro
          ref: ${{ steps.pro_source.outputs.ref }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro
          fetch-depth: 1
          persist-credentials: false # keep PRO_REPO_TOKEN out of pro/.git/config
      - name: Drop nested .git from pro/
        shell: bash
        run: rm -rf pro/.git # don't nest a repo inside the build tree
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      # node-gyp (better-sqlite3-multiple-ciphers) fails on Python 3.13+; pin 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Shared packages are file: dependencies on the shared monorepo, so it must sit BESIDE this
      # checkout before `npm ci` runs - an install cannot resolve a path that does not exist, and the
      # bundle then fails on imports from it. `ci.yml` has done this since
      # the sync work landed; this workflow did not, which is why no release has built since 2026-07-30.
      #
      # The release ref decides the shared ref: a release from `main` takes shared `main`, and a release
      # from an integration branch takes the branch of the same name when one exists.
      - name: Checkout shared at the matching ref
        id: shared_branch
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: ${{ github.ref_name }}
          path: _shared
          persist-credentials: false
      - name: Fall back to shared main
        if: ${{ steps.shared_branch.outcome != 'success' }}
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false
      - name: Put shared beside this checkout
        # Git Bash, explicitly: a windows runner runs `run:` under PowerShell, which parsed this
        # block as a .ps1 and failed before the first command.
        shell: bash
        run: |
          if [ ! -d _shared ]; then
            echo "::error::off-grid-ai/shared was not checked out - shared packages cannot resolve. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../shared
          mv _shared ../shared
          # Install at the WORKSPACE ROOT: shared is an npm-workspaces monorepo whose lockfile and
          # build tool live at the root, and packages/sync declares neither. A locked install, so a
          # drifted lock stops the release instead of resolving a graph nobody committed.
          npm --prefix ../shared ci
          npm --prefix ../shared/packages/sync run build
          # @offgrid/use (the durable action engine) is consumed the same way as sync
          # and needs the same explicit build - file-dep prepare alone does not emit
          # its dist/ output before the app bundle runs.
          npm --prefix ../shared/packages/use run build
          npm --prefix ../shared/packages/automation run build
          npm --prefix ../shared/packages/models run build
          npm --prefix ../shared/packages/speech run build
          npm --prefix ../shared/packages/ui run build
      - name: Check out the private Desktop speech package
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _executorch_speech
          lfs: false # The current native speech engine is macOS-only.
          persist-credentials: false
      - name: Put the speech package beside this checkout
        shell: bash
        run: |
          if [ ! -f _executorch_speech/package.json ]; then
            echo "::error::off-grid-ai/executorch-speech was not checked out. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../executorch-speech
          mv _executorch_speech ../executorch-speech
      - name: Install dependencies
        run: npm ci
      - name: Fetch Windows native binaries (llama/whisper/sd/ffmpeg)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API rate limit
          OFFGRID_INCLUDE_CUDA: '0'
        run: ./scripts/fetch-win-binaries.ps1
      - name: Stamp build version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Stage native files and bundle
        run: node scripts/stage-native.mjs && npx electron-vite build && node scripts/check-windows-onnx-preload.mjs
      - name: Package Windows web installer, payload, and update metadata
        shell: bash
        env:
          # Optional Windows code signing — a no-op if the secrets are absent (the
          # build still publishes, unsigned; SmartScreen warns until a cert is added).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --win --publish never
      - name: Verify Windows base runtimes
        shell: bash
        run: |
          test -s dist/win-unpacked/resources/performance-packs.json
          for binary in llama/llama-server.exe llama-cpu/llama-server.exe llama-prism/llama-server.exe llama-prism-cpu/llama-server.exe whisper-cpu/whisper-cli.exe sd/sd-cli.exe sd-cpu/sd-cli.exe ffmpeg.exe; do
            test -s "dist/win-unpacked/resources/bin/$binary"
          done
          for folder in llama-cuda llama-prism-cuda cuda-runtime sd-cuda whisper kev-runtime; do
            test ! -e "dist/win-unpacked/resources/bin/$folder"
          done
      - name: Report Windows native payload sizes
        shell: bash
        run: du -sh resources/bin/* | sort -h | tail -20
      - name: Publish Windows assets that fit GitHub Releases
        id: win_assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          installers=(dist/nsis-web/*-setup.exe)
          payloads=(dist/nsis-web/*.7z)
          test "${#installers[@]}" -eq 1
          test "${#payloads[@]}" -ge 1
          # nsis-web writes its update feed beside the installer and payload.
          feed=dist/nsis-web/latest.yml
          test -s "$feed"
          sha256sum "${installers[@]}" "${payloads[@]}" > dist/windows-packages.sha256
          gh release upload "v$VERSION" dist/windows-packages.sha256 --clobber
          limit=$((2 * 1024 * 1024 * 1024))
          for asset in "${installers[@]}" "${payloads[@]}"; do
            if [ "$(stat -c %s "$asset")" -ge "$limit" ]; then
              echo 'large=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          gh release upload "v$VERSION" "${installers[@]}" "${payloads[@]}" "$feed" --clobber
          echo 'large=false' >> "$GITHUB_OUTPUT"
      - name: Upload large Windows installer and payload to this workflow run
        if: steps.win_assets.outputs.large == 'true'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: OffGrid-Windows-${{ needs.version.outputs.version }}
          path: |
            dist/nsis-web/*-setup.exe
            dist/nsis-web/*.7z
            dist/nsis-web/*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Link large Windows package from the run summary
        if: steps.win_assets.outputs.large == 'true'
        shell: bash
        run: |
          echo "The Windows installer and payload are together in the [workflow run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> "$GITHUB_STEP_SUMMARY"
          echo 'The SHA-256 checksums are attached to the versioned release as windows-packages.sha256.' >> "$GITHUB_STEP_SUMMARY"
      # Permanent Windows download link — the Windows counterpart to the Mac
      # OffGrid-latest.dmg alias. The versioned installer (off-grid-ai-<v>-setup.exe)
      # changes name every release, so /releases/latest/download/<name> can't target
      # it; upload a constant-named copy for a stable URL:
      #   https://github.com/off-grid-ai/OGAD/releases/latest/download/OffGrid-latest-setup.exe
      # The versioned installer + latest.yml updater feed are untouched, so auto-update
      # is unaffected. --clobber replaces the copy from the prior run.
      - name: Publish stable latest-setup.exe alias
        if: needs.version.outputs.channel == 'stable' && steps.win_assets.outputs.large != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp dist/nsis-web/*-setup.exe dist/OffGrid-latest-setup.exe
          gh release upload "v$VERSION" dist/OffGrid-latest-setup.exe --clobber
      # Constant nightly Windows link on the rolling 'nightly' pre-release (mirrors the
      # Mac nightly.dmg link). build-win runs after build-mac, which already ensured the
      # 'nightly' release exists — the fallback create is just belt-and-suspenders.
      - name: Publish constant nightly-setup.exe link
        if: needs.version.outputs.channel == 'beta' && steps.win_assets.outputs.large != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/nsis-web/*-setup.exe dist/OffGrid-nightly-setup.exe
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly (rolling)" \
              --notes "Rolling nightly build, auto-updated on every change. Pre-release - expect rough edges."
          gh release upload nightly dist/OffGrid-nightly-setup.exe --clobber

  # Core Linux release. Upload AppImage, deb, and update metadata to the draft
  # release created by the version job while macOS and Windows build in parallel.
  build-linux:
    needs: version
    if: ${{ !inputs.artifact_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          lfs: false # Tracked native binaries are macOS files; build Linux ELF below.
          persist-credentials: false
      - name: Resolve pinned Pro source
        id: pro_source
        shell: bash
        env:
          PRO_BUILD_REF: ${{ inputs.pro_ref }}
        run: bash scripts/resolve-build-pro-ref.sh
      - name: Check out pinned Pro source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/desktop-pro
          ref: ${{ steps.pro_source.outputs.ref }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro
          persist-credentials: false
      - name: Drop nested Pro Git metadata
        shell: bash
        run: rm -rf pro/.git

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out shared at the matching ref
        id: shared_branch
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: ${{ github.ref_name }}
          path: _shared
          persist-credentials: false
      - name: Fall back to shared main
        if: ${{ steps.shared_branch.outcome != 'success' }}
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false
      - name: Build shared packages
        run: |
          test -d _shared || { echo 'Shared source is missing' >&2; exit 1; }
          mv _shared ../shared
          npm --prefix ../shared ci
          for package in models sync use automation speech ui rag design; do
            npm --prefix "../shared/packages/$package" run build
          done
      - name: Check out the Desktop speech package
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: e3b471e6ea8504f3877cd9f27a11bfe98ce3b3b5
          path: _executorch_speech
          lfs: false # Build the Linux executable from the pinned source.
          submodules: recursive
          persist-credentials: false
      - name: Put the speech package beside this checkout
        run: |
          test -f _executorch_speech/package.json
          mv _executorch_speech ../executorch-speech
      - name: Stage pinned Linux native engines
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/linux-native.tar.gz" \
            'https://github.com/off-grid-ai/OGAD/releases/download/native-deps-2026-09/ogad-linux-native-2026-09-x64-v1.tar.gz'
          echo '11f57bddc8b7b4c5efa4b4c298b8a000aaf0f203567f6c18953a6aff7a4e4b54  '"$RUNNER_TEMP/linux-native.tar.gz" | sha256sum -c -
          mkdir -p build/linux-bin
          tar -xzf "$RUNNER_TEMP/linux-native.tar.gz" -C build/linux-bin
          git lfs pull --include="resources/bin/kev-local-server.py" --exclude=""
          if head -n 1 resources/bin/kev-local-server.py | grep -q '^version https://git-lfs.github.com/spec/'; then
            echo 'Kev launcher is still an LFS pointer' >&2
            exit 1
          fi
          install -Dm644 resources/bin/kev-local-server.py build/linux-bin/kev-local-server.py
          install -Dm755 build/linux-bin/executorch-speech \
            ../executorch-speech/native/bin/executorch-speech
      - name: Install dependencies
        run: npm ci
      - name: Install Linux GPU runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libgomp1 libvulkan1 libvulkan-dev glslc spirv-headers unzip
      - name: Typecheck Linux main process
        env:
          OFFGRID_FORCE_CORE: '0'
        run: npm run typecheck:node
      - name: Stamp build version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build Linux packages
        env:
          OFFGRID_FORCE_CORE: '0'
        run: npm run build:linux:pinned
      - name: Report Linux native payload sizes
        run: du -sh dist/linux-unpacked/resources/bin/* | sort -h | tail -25
      - name: Verify Linux package inputs
        run: |
          test -s dist/linux-unpacked/resources/performance-packs.json
          cmp resources/bin/kev-local-server.py dist/linux-unpacked/resources/bin/kev-local-server.py
          for folder in llama-cuda llama-prism-cuda cuda-runtime sd-cuda whisper-cuda kev-runtime; do
            test ! -e "dist/linux-unpacked/resources/bin/$folder"
          done
          for variant in llama llama-cpu llama-prism llama-prism-cpu; do
            engine="dist/linux-unpacked/resources/bin/$variant/llama-server"
            test -x "$engine"
            file "$engine" | grep -q 'ELF 64-bit.*x86-64'
            LD_LIBRARY_PATH="$(dirname "$engine")" ldd "$engine" | tee "$RUNNER_TEMP/$variant-ldd.txt"
            if grep -q 'not found' "$RUNNER_TEMP/$variant-ldd.txt"; then exit 1; fi
            LD_LIBRARY_PATH="$(dirname "$engine")" "$engine" --version
          done
          for variant in llama llama-prism; do
            test -f "dist/linux-unpacked/resources/bin/$variant/libggml-vulkan.so"
          done
          for helper in whisper/whisper-cli whisper-cpu/whisper-cli ffmpeg; do
            binary="dist/linux-unpacked/resources/bin/$helper"
            test -x "$binary"
            file "$binary" | grep -q 'ELF 64-bit.*x86-64'
            ldd "$binary" | tee "$RUNNER_TEMP/$(basename "$binary")-ldd.txt"
            if grep -q 'not found' "$RUNNER_TEMP/$(basename "$binary")-ldd.txt"; then exit 1; fi
          done
          dist/linux-unpacked/resources/bin/ffmpeg -version >/dev/null
          dist/linux-unpacked/resources/bin/whisper/whisper-cli --help >/dev/null 2>&1
          dist/linux-unpacked/resources/bin/whisper-cpu/whisper-cli --help >/dev/null 2>&1
          for helper in sd/sd-cli sd/sd-server executorch-speech; do
            binary="dist/linux-unpacked/resources/bin/$helper"
            test -x "$binary"
            file "$binary" | grep -q 'ELF 64-bit.*x86-64'
            LD_LIBRARY_PATH="$(dirname "$binary")" ldd "$binary" | tee "$RUNNER_TEMP/$(basename "$binary")-ldd.txt"
            if grep -q 'not found' "$RUNNER_TEMP/$(basename "$binary")-ldd.txt"; then exit 1; fi
          done
          LD_LIBRARY_PATH=dist/linux-unpacked/resources/bin/sd \
            dist/linux-unpacked/resources/bin/sd/sd-cli --list-devices | grep -q '^CPU'
          dist/linux-unpacked/resources/bin/executorch-speech --probe
          test -f dist/linux-unpacked/resources/speech-assets/index.json
          test -f dist/linux-unpacked/resources/bin/whisper/LICENSE
          test -f dist/linux-unpacked/resources/bin/licenses/ffmpeg.txt
          test -f dist/linux-unpacked/resources/bin/licenses/libgomp1.txt
          test -f dist/linux-unpacked/resources/bin/licenses/libvulkan1.txt
          test -n "$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux.yml' -print -quit)"
      - name: Smoke-test local Linux voice transcription
        run: bash scripts/probe-linux-voice.sh dist/linux-unpacked/resources/bin
      - name: Smoke-test local Linux voice output
        run: node scripts/probe-linux-tts.mjs
      - name: Verify packaged Linux native modules
        run: |
          ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/off-grid-ai -e '
            const path = require("node:path")
            const root = path.resolve("dist/linux-unpacked/resources/app.asar/node_modules")
            const Database = require(path.join(root, "better-sqlite3-multiple-ciphers"))
            new Database(":memory:").close()
            if (typeof require(path.join(root, "@lancedb/lancedb")).connect !== "function") {
              throw new Error("LanceDB native package did not load")
            }
            if (typeof require(path.join(root, "sharp")) !== "function") {
              throw new Error("Sharp native package did not load")
            }
            console.log("packaged Linux native modules loaded")
          '
      - name: Verify Linux artifact payloads
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -x "$appimage"
          dpkg-deb --info "$deb" >/dev/null
          dependencies="$(dpkg-deb --field "$deb" Depends)"
          grep -q 'libgtk-3-0t64' <<< "$dependencies"
          grep -q 'libatspi2.0-0t64' <<< "$dependencies"
          extraction="$(mktemp -d)"
          trap 'rm -rf -- "$extraction"' EXIT
          (cd "$extraction" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          for variant in llama llama-cpu llama-prism llama-prism-cpu; do
            bundled="$(find "$extraction/squashfs-root" -path "*/resources/bin/$variant/llama-server" -type f -print -quit)"
            test -n "$bundled"
            cmp "dist/linux-unpacked/resources/bin/$variant/llama-server" "$bundled"
          done
          for helper in whisper/whisper-cli whisper-cpu/whisper-cli whisper/LICENSE ffmpeg licenses/ffmpeg.txt sd/sd-cli sd/sd-server sd/libggml-vulkan.so sd/libgomp.so.1 sd/libvulkan.so.1 executorch-speech licenses/libgomp1.txt licenses/libvulkan1.txt; do
            bundled="$(find "$extraction/squashfs-root" -path "*/resources/bin/$helper" -type f -print -quit)"
            test -n "$bundled"
            cmp "dist/linux-unpacked/resources/bin/$helper" "$bundled"
          done
          test -z "$(find "$extraction/squashfs-root" -path '*/resources/bin/cuda-runtime/libcublasLt.so.12' -print -quit)"
          test -f "$(find "$extraction/squashfs-root" -path '*/resources/speech-assets/index.json' -type f -print -quit)"
          bundled_asar="$(find "$extraction/squashfs-root" -name app.asar -type f -print -quit)"
          test -n "$bundled_asar"
          cmp dist/linux-unpacked/resources/app.asar "$bundled_asar"
          rm -rf -- "$extraction/squashfs-root"
          dpkg-deb --extract "$deb" "$extraction/deb"
          for variant in llama llama-cpu llama-prism llama-prism-cpu; do
            bundled="$(find "$extraction/deb" -path "*/resources/bin/$variant/llama-server" -type f -print -quit)"
            test -n "$bundled"
            cmp "dist/linux-unpacked/resources/bin/$variant/llama-server" "$bundled"
          done
          for helper in whisper/whisper-cli whisper-cpu/whisper-cli whisper/LICENSE ffmpeg licenses/ffmpeg.txt sd/sd-cli sd/sd-server sd/libggml-vulkan.so sd/libgomp.so.1 sd/libvulkan.so.1 executorch-speech licenses/libgomp1.txt licenses/libvulkan1.txt; do
            bundled="$(find "$extraction/deb" -path "*/resources/bin/$helper" -type f -print -quit)"
            test -n "$bundled"
            cmp "dist/linux-unpacked/resources/bin/$helper" "$bundled"
          done
          test -z "$(find "$extraction/deb" -path '*/resources/bin/cuda-runtime/libcublasLt.so.12' -print -quit)"
          test -f "$(find "$extraction/deb" -path '*/resources/speech-assets/index.json' -type f -print -quit)"
          bundled_asar="$(find "$extraction/deb" -name app.asar -type f -print -quit)"
          test -n "$bundled_asar"
          cmp dist/linux-unpacked/resources/app.asar "$bundled_asar"
      - name: Publish Linux assets that fit GitHub Releases
        id: linux_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          feeds=(dist/*-linux.yml)
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          test "${#feeds[@]}" -ge 1
          # GitHub Releases rejects each asset >= 2 GiB. Keep large verified
          # packages as Actions artifacts instead of failing a public release.
          limit=$((2 * 1024 * 1024 * 1024))
          if [ "$(stat -c %s "${appimages[0]}")" -lt "$limit" ]; then
            gh release upload "v$VERSION" "${appimages[0]}" "${feeds[@]}" --clobber
            echo 'appimage_large=false' >> "$GITHUB_OUTPUT"
          else
            echo 'appimage_large=true' >> "$GITHUB_OUTPUT"
          fi
          if [ "$(stat -c %s "${debs[0]}")" -lt "$limit" ]; then
            gh release upload "v$VERSION" "${debs[0]}" --clobber
            echo 'deb_large=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deb_large=true' >> "$GITHUB_OUTPUT"
          fi
          sha256sum "${appimages[0]}" "${debs[0]}" > dist/linux-packages.sha256
          gh release upload "v$VERSION" dist/linux-packages.sha256 --clobber
      - name: Upload large Linux AppImage to this workflow run
        if: steps.linux_assets.outputs.appimage_large == 'true'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: OffGrid-Linux-AppImage-${{ needs.version.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload large Linux deb to this workflow run
        if: steps.linux_assets.outputs.deb_large == 'true'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: OffGrid-Linux-deb-${{ needs.version.outputs.version }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Link large Linux packages from the run summary
        if: steps.linux_assets.outputs.appimage_large == 'true' || steps.linux_assets.outputs.deb_large == 'true'
        run: |
          echo "Large Linux packages are available in the [workflow run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> "$GITHUB_STEP_SUMMARY"
          echo 'The SHA-256 checksums are attached to the versioned release as linux-packages.sha256.' >> "$GITHUB_STEP_SUMMARY"

  # Announce only when all three installers have built and published successfully.
  announce:
    needs: [version, build-mac, build-win, build-linux]
    if: ${{ !inputs.artifact_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Read published release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release view "v$VERSION" --json body --jq .body > release-notes.md
      - name: Announce release in Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRODUCT: Off Grid AI Desktop
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL_LABEL: ${{ needs.version.outputs.channel }}
          NOTES_FILE: release-notes.md
          RELEASE_URL: https://github.com/off-grid-ai/OGAD/releases/tag/v${{ needs.version.outputs.version }}
        run: node scripts/notify-slack-release.mjs
