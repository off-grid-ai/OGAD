name: Branch Builds (Windows and Linux)

# Manually package Windows and Linux installers from any branch without changing
# package.json, creating a tag, or publishing a release. The historical push
# trigger keeps the existing feat/windows-support Windows build behavior.

on:
  push:
    branches:
      - feat/windows-support
  workflow_dispatch: # lets you trigger a build manually from the Actions tab
    inputs:
      build_ref:
        description: 'OGAD branch, tag, or commit to build (empty = selected workflow ref)'
        type: string
        required: false
        default: ''
      platform:
        description: 'Installer platform to build'
        type: choice
        required: true
        default: both
        options:
          - both
          - windows
          - linux
      pro_ref:
        # Manual builds use desktop-pro main unless the operator pins another ref.
        # The historical push trigger has no input and still uses the default branch.
        description: 'desktop-pro branch, tag, or commit to bundle for Windows'
        type: string
        required: false
        default: 'main'
      shared_ref:
        # off-grid-ai/shared carries @offgrid/models|sync|use. This core branch depends
        # on shared feature work that is NOT on shared main, and the auto match below is
        # by BRANCH NAME - which differs across repos here - so it would fall back to main
        # and miss effectId/undo/computer_use. Pin it on dispatch (e.g. feat/use-approval-tiers).
        description: 'off-grid-ai/shared ref for @offgrid/* (empty = match this branch name, else shared main)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-win:
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    # windows-2022 = VS 2022 toolchain. windows-latest ships VS 2026 (VS 18),
    # which node-gyp 11 can't parse — breaking native-module (better-sqlite3,
    # node-llama-cpp) compiles. Pin until node-gyp catches up.
    runs-on: windows-2022
    env:
      # True when the private-repo token is configured, so we bundle Pro (same as
      # the Mac release build). Falsey on a fork / missing secret → core-only exe.
      # Can't reference `secrets` directly in a step `if`, so surface it as env.
      HAS_PRO_TOKEN: ${{ secrets.PRO_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          persist-credentials: false # don't leave the token in .git/config for npm postinstall scripts
          lfs: false # pull only the cross-platform Kev launcher below, not ~235 MB of macOS binaries
      - name: Pull the Kev server launcher from LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="resources/bin/kev-local-server.py" --exclude=""
          if head -n 1 resources/bin/kev-local-server.py | grep -q '^version https://git-lfs.github.com/spec/'; then
            echo "::error::Kev server launcher is still an LFS pointer"
            exit 1
          fi

      # Private pro source into pro/ → __OFFGRID_PRO__ true, so the exe bundles the
      # Pro layer (mirrors release.yml). Needed to exercise the Pro "coming soon"
      # gate on Windows. Pro stays license-gated at runtime; launch with
      # OFFGRID_PRO=1 to force it on for testing without a license. Skipped (core
      # build) when PRO_REPO_TOKEN isn't available.
      - uses: actions/checkout@v4
        if: env.HAS_PRO_TOKEN == 'true'
        with:
          repository: off-grid-ai/desktop-pro
          # Push events have no pro_ref input, so checkout uses the default branch.
          ref: ${{ inputs.pro_ref }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro
          fetch-depth: 1
          persist-credentials: false # keep PRO_REPO_TOKEN out of pro/.git/config
      - name: Drop nested .git from pro/
        if: env.HAS_PRO_TOKEN == 'true'
        shell: bash
        run: rm -rf pro/.git # don't nest a repo inside the build tree

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-gyp (better-sqlite3-multiple-ciphers) fails on Python 3.13+; pin 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the private Desktop speech package
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _executorch_speech
          lfs: false # The current native speech engine is macOS-only.
          persist-credentials: false
      - name: Put the speech package beside this checkout
        shell: bash
        run: |
          if [ ! -f _executorch_speech/package.json ]; then
            echo "::error::off-grid-ai/executorch-speech was not checked out. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../executorch-speech
          mv _executorch_speech ../executorch-speech

      # `@offgrid/sync` and `@offgrid/use` are file: dependencies on the shared
      # monorepo, so it must sit BESIDE this checkout before `npm ci` runs -
      # mirrors release.yml's build-win. The branch ref decides the shared ref:
      # a build from an integration branch takes the shared branch of the same
      # name when one exists, else shared main.
      - name: Checkout shared at the matching ref
        id: shared_branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: ${{ inputs.shared_ref || inputs.build_ref || github.ref_name }}
          path: _shared
          persist-credentials: false
      - name: Fall back to shared main
        if: ${{ steps.shared_branch.outcome != 'success' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false
      - name: Put shared beside this checkout
        shell: bash
        run: |
          if [ ! -d _shared ]; then
            echo "::error::off-grid-ai/shared was not checked out - @offgrid/sync and @offgrid/use cannot resolve. Check CI_CROSS_REPO_TOKEN."
            exit 1
          fi
          rm -rf ../shared
          mv _shared ../shared
          npm --prefix ../shared ci
          npm --prefix ../shared/packages/models run build
          npm --prefix ../shared/packages/sync run build
          npm --prefix ../shared/packages/use run build
          npm --prefix ../shared/packages/automation run build
          npm --prefix ../shared/packages/speech run build
          npm --prefix ../shared/packages/ui run build

      - name: Install dependencies
        run: npm ci

      - name: Verify the computer-use input addon (nut.js) shipped for Windows
        shell: pwsh
        run: |
          # The vision computer-use rail drives the cursor/keyboard through
          # @nut-tree-fork/nut-js, whose Windows binding is the prebuilt (N-API)
          # libnut-win32 addon - an OPTIONAL dependency. If npm skips it or the
          # prebuild fails to land, the rail loads null and refuses every task
          # silently. Fail the build loudly instead, the same way
          # fetch-win-binaries.ps1 fails on a missing llama-server.exe.
          $addon = "node_modules/@nut-tree-fork/libnut-win32/build/Release/libnut.node"
          if (-not (Test-Path $addon)) {
            Write-Error "Missing $addon - the Windows computer-use rail would refuse every task. Confirm @nut-tree-fork/libnut-win32 installed (optional dep)."
            exit 1
          }
          Write-Host "OK: computer-use addon present ($((Get-Item $addon).Length) bytes)"

      - name: Fetch Windows native binaries (llama/whisper/sd/ffmpeg)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API rate limit
        run: ./scripts/fetch-win-binaries.ps1

      - name: Build Kev server runtime (model weights excluded)
        shell: pwsh
        run: ./scripts/build-kev-runtime.ps1

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Package Windows installer (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing (no-op if absent → unsigned; SmartScreen
          # will warn until you add a cert via these secrets).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'linux') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: false # Tracked native binaries are macOS files; build Linux ELF below.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out shared at the matching ref
        id: shared_branch_linux
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: ${{ inputs.shared_ref || inputs.build_ref || github.ref_name }}
          path: _shared
          persist-credentials: false

      - name: Fall back to shared main
        if: ${{ steps.shared_branch_linux.outcome != 'success' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          path: _shared
          persist-credentials: false

      - name: Build shared packages
        shell: bash
        run: |
          set -euo pipefail
          test -d _shared || { echo 'Shared source is missing' >&2; exit 1; }
          rm -rf ../shared
          mv _shared ../shared
          npm --prefix ../shared ci
          for package in models sync use automation speech ui rag design; do
            npm --prefix "../shared/packages/$package" run build
          done

      - name: Check out the Desktop speech package
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/executorch-speech
          token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ref: e3b471e6ea8504f3877cd9f27a11bfe98ce3b3b5
          path: _executorch_speech
          lfs: false
          submodules: recursive
          persist-credentials: false

      - name: Put the speech package beside this checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f _executorch_speech/package.json
          rm -rf ../executorch-speech
          mv _executorch_speech ../executorch-speech

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        run: |
          python3 -m pip install --no-cache-dir 'torch==2.11.0+cpu' PyYAML Jinja2 \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          python3 -c 'import torchgen, yaml, jinja2'
          sudo apt-get update -qq
          sudo apt-get install -y libgomp1 libvulkan1 libvulkan-dev glslc unzip

      - name: Typecheck core Linux main process
        env:
          OFFGRID_FORCE_CORE: '1'
        run: npm run typecheck:node

      - name: Build Linux installers without changing the version
        env:
          OFFGRID_FORCE_CORE: '1'
        run: npm run build:linux

      - name: Verify Linux package inputs
        shell: bash
        run: |
          set -euo pipefail
          for variant in llama llama-cpu llama-prism llama-prism-cpu; do
            engine="dist/linux-unpacked/resources/bin/$variant/llama-server"
            test -x "$engine"
            file "$engine" | grep -q 'ELF 64-bit.*x86-64'
            LD_LIBRARY_PATH="$(dirname "$engine")" ldd "$engine" | tee "$RUNNER_TEMP/$variant-ldd.txt"
            ! grep -q 'not found' "$RUNNER_TEMP/$variant-ldd.txt"
            LD_LIBRARY_PATH="$(dirname "$engine")" "$engine" --version
          done
          for variant in llama-cuda llama-prism-cuda; do
            test -x "dist/linux-unpacked/resources/bin/$variant/llama-server"
            test -f "dist/linux-unpacked/resources/bin/$variant/libggml-cuda.so"
          done
          for library in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            test -f "dist/linux-unpacked/resources/bin/cuda-runtime/$library"
          done
          for helper in whisper/whisper-cli whisper-cpu/whisper-cli; do
            test -x "dist/linux-unpacked/resources/bin/$helper"
          done
          test -n "$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux.yml' -print -quit)"

      - name: Smoke-test local Linux voice
        run: |
          bash scripts/probe-linux-voice.sh dist/linux-unpacked/resources/bin
          node scripts/probe-linux-tts.mjs

      - name: Verify packaged CUDA dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist/linux-unpacked/resources/bin:/engines:ro" ubuntu:24.04 bash -euo pipefail -c '
            for variant in llama-cuda llama-prism-cuda; do
              export LD_LIBRARY_PATH="/engines/$variant:/engines/cuda-runtime"
              dependencies="$(ldd "/engines/$variant/llama-server"; ldd "/engines/$variant/libggml-cuda.so")"
              missing="$(printf "%s\n" "$dependencies" | grep "not found" | grep -v "libcuda.so.1" || true)"
              test -z "$missing" || { printf "%s\n" "$missing" >&2; exit 1; }
              if [ "$variant" = llama-cuda ]; then
                "/engines/$variant/llama-server" --version
                "/engines/$variant/llama-server" --list-devices
              fi
            done
          '

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-linux.yml
          if-no-files-found: error
