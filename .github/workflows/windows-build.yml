name: Branch Builds (Windows and Linux)

# Manually package Windows and Linux installers from any branch without changing
# package.json, creating a tag, or publishing a release. The historical push
# trigger keeps the existing feat/windows-support Windows build behavior.

on:
  push:
    branches:
      - feat/windows-support
  workflow_dispatch: # lets you trigger a build manually from the Actions tab
    inputs:
      build_ref:
        description: 'OGAD branch, tag, or commit to build (empty = selected workflow ref)'
        type: string
        required: false
        default: ''
      platform:
        description: 'Installer platform to build'
        type: choice
        required: true
        default: both
        options:
          - both
          - windows
          - linux
          - none
      pro_ref:
        # Use the Pro gitlink from the selected Core commit unless overridden.
        description: 'desktop-pro branch/tag/sha (empty = commit pinned by Core)'
        type: string
        required: false
        default: ''
      shared_ref:
        # off-grid-ai/shared carries @offgrid/models|sync|use. This core branch depends
        # on shared feature work that is NOT on shared main, and the auto match below is
        # by BRANCH NAME - which differs across repos here - so it would fall back to main
        # and miss effectId/undo/computer_use. Pin it on dispatch (e.g. feat/use-approval-tiers).
        description: 'off-grid-ai/shared ref for @offgrid/* (empty = match this branch name, else shared main)'
        type: string
        required: false
        default: ''

      store_packages:
        # Also build the Microsoft Store MSIX and the Ubuntu App Center snap from the
        # same unpacked app. Uploaded as artifacts; store submission stays manual for now.
        description: 'Also build store packages (MSIX, snap)'
        type: boolean
        required: false
        default: false

      snap_release_tag:
        # Package a published release for the stores (e.g. v0.0.59): a snap from its .deb
        # (uploaded when SNAPCRAFT_STORE_CREDENTIALS is set) and a Microsoft Store MSIX from
        # its Windows payload (an artifact to upload in Partner Center).
        description: 'Release tag to package for the stores (empty = skip)'
        type: string
        required: false
        default: ''
      store_build:
        # The release run's number. The Microsoft Store wants a plain a.b.c.0 that only ever grows,
        # beta or stable, so the MSIX takes <major>.<minor>.<run> (0.0.159.0). The app inside keeps
        # its own version. Empty = the tag's own number (a stable tag only).
        description: 'Release run number for the MSIX version (empty = the tag version)'
        type: string
        required: false
        default: ''
      snap_channel:
        description: 'Store channel for that release (Snap channel; beta = the Microsoft Store beta flight)'
        type: choice
        required: false
        default: stable
        options:
          - stable
          - candidate
          - beta
          - edge

permissions:
  contents: read

jobs:
  build-win:
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    # windows-2022 = VS 2022 toolchain. windows-latest ships VS 2026 (VS 18),
    # which node-gyp 11 can't parse — breaking native-module (better-sqlite3,
    # node-llama-cpp) compiles. Pin until node-gyp catches up.
    runs-on: windows-2022
    env:
      # True when the private-repo token is configured, so we bundle Pro (same as
      # the Mac release build). Falsey on a fork / missing secret → core-only exe.
      # Can't reference `secrets` directly in a step `if`, so surface it as env.
      HAS_PRO_TOKEN: ${{ secrets.PRO_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          persist-credentials: false # don't leave the token in .git/config for npm postinstall scripts
          lfs: false # pull only the cross-platform Kev launcher below, not ~235 MB of macOS binaries
      - name: Check Windows source setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Setup-OGAD-Source.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Pull the Kev server launcher from LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="resources/bin/kev-local-server.py" --exclude=""
          if head -n 1 resources/bin/kev-local-server.py | grep -q '^version https://git-lfs.github.com/spec/'; then
            echo "::error::Kev server launcher is still an LFS pointer"
            exit 1
          fi

      # Private pro source into pro/ → __OFFGRID_PRO__ true, so the exe bundles the
      # Pro layer (mirrors release.yml). Needed to exercise the Pro "coming soon"
      # gate on Windows. Pro stays license-gated at runtime; launch with
      # OFFGRID_PRO=1 to force it on for testing without a license. Skipped (core
      # build) when PRO_REPO_TOKEN isn't available.
      - name: Resolve pinned Pro source
        if: env.HAS_PRO_TOKEN == 'true'
        id: pro_source
        shell: bash
        env:
          PRO_BUILD_REF: ${{ inputs.pro_ref }}
        run: bash scripts/resolve-build-pro-ref.sh
      # Node, pro, shared, the speech package and `npm ci`: the release's setup
      # (.github/actions/setup-desktop), restoring the caches main's CI saved.
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
          pro: ${{ env.HAS_PRO_TOKEN }}
          pro-ref: ${{ steps.pro_source.outputs.ref }}
          pro-token: ${{ secrets.PRO_REPO_TOKEN }}
          # The shared ref pinned on dispatch, else the branch that matches the build, else main.
          branch: ${{ inputs.build_ref || github.ref_name }}
          shared-ref: ${{ inputs.shared_ref }}
          speech-ref: d005e3509e6f608bb4e70abbe9f089120a08e973 # the release's ExecuTorch 1.5.1
          speech-binary: 'false'
          python-version: '3.12'
          save-caches: 'false'
      - name: Drop nested .git from pro/
        if: env.HAS_PRO_TOKEN == 'true'
        shell: bash
        run: rm -rf pro/.git # don't nest a repo inside the build tree

      - name: Verify the computer-use input addon (nut.js) shipped for Windows
        shell: pwsh
        run: |
          # The vision computer-use rail drives the cursor/keyboard through
          # @nut-tree-fork/nut-js, whose Windows binding is the prebuilt (N-API)
          # libnut-win32 addon - an OPTIONAL dependency. If npm skips it or the
          # prebuild fails to land, the rail loads null and refuses every task
          # silently. Fail the build loudly instead, the same way
          # fetch-win-binaries.ps1 fails on a missing llama-server.exe.
          $addon = "node_modules/@nut-tree-fork/libnut-win32/build/Release/libnut.node"
          if (-not (Test-Path $addon)) {
            Write-Error "Missing $addon - the Windows computer-use rail would refuse every task. Confirm @nut-tree-fork/libnut-win32 installed (optional dep)."
            exit 1
          }
          Write-Host "OK: computer-use addon present ($((Get-Item $addon).Length) bytes)"

      - name: Windows Vulkan Whisper
        uses: ./.github/actions/windows-whisper

      - name: Fetch Windows native binaries (llama/whisper/sd/ffmpeg)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API rate limit
        run: ./scripts/fetch-win-binaries.ps1

      - name: Stage the pinned sherpa-onnx (Parakeet)
        shell: bash
        run: node scripts/fetch-sherpa.mjs --check

      - name: Build Kev server runtime (model weights excluded)
        shell: pwsh
        run: ./scripts/build-kev-runtime.ps1

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Package Windows web installer and payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing (no-op if absent → unsigned; SmartScreen
          # will warn until you add a cert via these secrets).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Verify every Windows binary finds its DLLs on a clean install
        shell: bash
        # A DLL a binary imports must sit beside it or be part of Windows (0.0.58 crashed at launch:
        # onnxruntime-node's binding shipped without the VC++ runtime). The main process must also
        # open without loading ONNX Runtime.
        run: |
          node scripts/verify-windows-dll-imports.mjs dist/win-unpacked
          node scripts/verify-main-startup-imports.mjs out/main

      - name: Package Microsoft Store MSIX
        if: ${{ inputs.store_packages }}
        env:
          # From Partner Center → Product identity. Without them the MSIX is a test package.
          MS_STORE_IDENTITY_NAME: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_NAME: ${{ secrets.MS_STORE_PUBLISHER_NAME }}
        shell: bash
        run: |
          args=()
          if [ -n "$MS_STORE_IDENTITY_NAME" ]; then
            args+=("-c.appx.identityName=$MS_STORE_IDENTITY_NAME" "-c.appx.publisher=$MS_STORE_PUBLISHER" "-c.appx.publisherDisplayName=$MS_STORE_PUBLISHER_NAME")
          fi
          npx electron-builder --config build/msix.yml --win appx --x64 --prepackaged dist/win-unpacked --publish never "${args[@]}"

      - name: Upload Microsoft Store MSIX artifact
        if: ${{ inputs.store_packages }}
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-windows-msix
          path: dist/*.appx
          if-no-files-found: error
          compression-level: 0

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-windows
          path: |
            dist/nsis-web/*.exe
            dist/nsis-web/*.7z
          if-no-files-found: error
          compression-level: 0

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'linux') }}
    runs-on: ubuntu-24.04
    env:
      HAS_PRO_TOKEN: ${{ secrets.PRO_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: false # Tracked native binaries are macOS files; build Linux ELF below.
          persist-credentials: false
      - name: Check Linux source setup script syntax
        run: bash -n scripts/Setup-OGAD-Source.sh

      - name: Resolve pinned Pro source
        if: env.HAS_PRO_TOKEN == 'true'
        id: pro_source
        shell: bash
        env:
          PRO_BUILD_REF: ${{ inputs.pro_ref }}
        run: bash scripts/resolve-build-pro-ref.sh
      # Node, pro, shared, the speech package and `npm ci`: the release's setup
      # (.github/actions/setup-desktop), restoring the caches main's CI saved.
      - name: Set up the workspace
        uses: ./.github/actions/setup-desktop
        with:
          cross-repo-token: ${{ secrets.CI_CROSS_REPO_TOKEN }}
          ui-token: ${{ secrets.OPERATOR_UI_TOKEN }}
          pro: ${{ env.HAS_PRO_TOKEN }}
          pro-ref: ${{ steps.pro_source.outputs.ref }}
          pro-token: ${{ secrets.PRO_REPO_TOKEN }}
          # The shared ref pinned on dispatch, else the branch that matches the build, else main.
          branch: ${{ inputs.build_ref || github.ref_name }}
          shared-ref: ${{ inputs.shared_ref }}
          speech-ref: d005e3509e6f608bb4e70abbe9f089120a08e973 # the release's ExecuTorch 1.5.1
          speech-binary: 'false'
          python-version: '3.12'
          save-caches: 'false'
      - name: Drop nested Pro Git metadata
        if: env.HAS_PRO_TOKEN == 'true'
        shell: bash
        run: rm -rf pro/.git # don't nest a repo inside the build tree

      - name: Install Linux build dependencies
        run: |
          python3 -m pip install --no-cache-dir 'torch==2.11.0+cpu' PyYAML Jinja2 \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          python3 -c 'import torchgen, yaml, jinja2'
          sudo apt-get update -qq
          sudo apt-get install -y libgomp1 libvulkan1 libvulkan-dev glslc spirv-headers unzip

      - name: Typecheck Linux main process
        env:
          OFFGRID_FORCE_CORE: ${{ env.HAS_PRO_TOKEN == 'true' && '0' || '1' }}
        run: npm run typecheck:node

      - name: Build Linux installers without changing the version
        env:
          OFFGRID_FORCE_CORE: ${{ env.HAS_PRO_TOKEN == 'true' && '0' || '1' }}
        run: npm run build:linux

      - name: Verify packaged Kev runtime
        run: |
          test -f dist/linux-unpacked/resources/bin/kev-local-server.py
          dist/linux-unpacked/resources/bin/kev-runtime/python/bin/python3 -c 'import kev, torch, uvicorn; assert torch.version.cuda'
      - name: Verify Linux package inputs
        shell: bash
        run: |
          set -euo pipefail
          for variant in llama llama-cpu llama-prism llama-prism-cpu; do
            engine="dist/linux-unpacked/resources/bin/$variant/llama-server"
            test -x "$engine"
            file "$engine" | grep -q 'ELF 64-bit.*x86-64'
            LD_LIBRARY_PATH="$(dirname "$engine")" ldd "$engine" | tee "$RUNNER_TEMP/$variant-ldd.txt"
            if grep -q 'not found' "$RUNNER_TEMP/$variant-ldd.txt"; then exit 1; fi
            LD_LIBRARY_PATH="$(dirname "$engine")" "$engine" --version
          done
          for variant in llama-cuda llama-prism-cuda; do
            test -x "dist/linux-unpacked/resources/bin/$variant/llama-server"
            test -f "dist/linux-unpacked/resources/bin/$variant/libggml-cuda.so"
          done
          for library in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            test -f "dist/linux-unpacked/resources/bin/cuda-runtime/$library"
          done
          for helper in whisper-cuda/whisper-cli whisper/whisper-cli whisper-cpu/whisper-cli; do
            test -x "dist/linux-unpacked/resources/bin/$helper"
          done
          test -n "$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux.yml' -print -quit)"

      - name: Smoke-test local Linux voice
        run: |
          bash scripts/probe-linux-voice.sh dist/linux-unpacked/resources/bin
          node scripts/probe-linux-tts.mjs

      - name: Verify packaged CUDA dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist/linux-unpacked/resources/bin:/engines:ro" ubuntu:24.04 bash -euo pipefail -c '
            for variant in llama-cuda llama-prism-cuda; do
              export LD_LIBRARY_PATH="/engines/$variant:/engines/cuda-runtime"
              dependencies="$(ldd "/engines/$variant/llama-server"; ldd "/engines/$variant/libggml-cuda.so")"
              missing="$(printf "%s\n" "$dependencies" | grep "not found" | grep -v "libcuda.so.1" || true)"
              test -z "$missing" || { printf "%s\n" "$missing" >&2; exit 1; }
              if [ "$variant" = llama-cuda ]; then
                "/engines/$variant/llama-server" --version
                "/engines/$variant/llama-server" --list-devices
              fi
            done
            for binary in whisper-cuda/whisper-cli sd-cuda/sd-cli sd-cuda/sd-server; do
              test -x "/engines/$binary"
              export LD_LIBRARY_PATH="/engines/$(dirname "$binary"):/engines/cuda-runtime"
              dependencies="$(ldd "/engines/$binary")"
              missing="$(printf "%s\n" "$dependencies" | grep "not found" | grep -v "libcuda.so.1" || true)"
              test -z "$missing" || { printf "%s\n" "$missing" >&2; exit 1; }
            done
          '

      - name: Set up LXD for snapcraft
        if: ${{ inputs.store_packages }}
        uses: canonical/setup-lxd@v0.1.2

      - name: Package Ubuntu App Center snap
        if: ${{ inputs.store_packages }}
        run: |
          sudo snap install snapcraft --classic
          npx electron-builder --linux snap --x64 --prepackaged dist/linux-unpacked --publish never

      - name: Upload Ubuntu App Center snap artifact
        if: ${{ inputs.store_packages }}
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-linux-snap
          path: dist/*.snap
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-linux-appimage
          path: |
            dist/*.AppImage
            dist/*-linux.yml
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0

  publish-snap:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.snap_release_tag != '' }}
    runs-on: ubuntu-24.04
    env:
      HAS_SNAP_LOGIN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the release's .deb and stamp its version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.snap_release_tag }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "off-grid-ai_${version}_amd64.deb" -O snap/release/off-grid-ai.deb
          cp resources/icon.png snap/release/snap/gui/off-grid-ai.png
          sed -i "s/^version: 'VERSION'/version: '${version}'/" snap/release/snap/snapcraft.yaml
          grep -n '^version:' snap/release/snap/snapcraft.yaml

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: snap/release

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-snap-${{ inputs.snap_release_tag }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish to the Snap Store
        if: ${{ env.HAS_SNAP_LOGIN == 'true' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.snap_channel }}

  package-msix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.snap_release_tag != '' }}
    runs-on: windows-2022
    env:
      HAS_MS_STORE_API: ${{ secrets.MS_STORE_CLIENT_SECRET != '' && secrets.MS_STORE_PRODUCT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and unpack the release's Windows app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.snap_release_tag }}
          STORE_BUILD: ${{ inputs.store_build }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "off-grid-ai-${version}-x64.nsis.7z" -O payload.7z
          7z x payload.7z -oapp -y > /dev/null
          test -f app/off-grid-ai.exe
          if [ -n "$STORE_BUILD" ]; then
            IFS=. read -r major minor _ <<< "${version%%-*}"
            npm pkg set version="${major}.${minor}.${STORE_BUILD}"
          else
            npm pkg set version="$version"
          fi

      - name: Package Microsoft Store MSIX
        shell: bash
        env:
          MS_STORE_IDENTITY_NAME: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_NAME: ${{ secrets.MS_STORE_PUBLISHER_NAME }}
        run: |
          npx --yes electron-builder@26.16.1 --config build/msix.yml --win appx --x64 --prepackaged app --publish never \
            "-c.appx.identityName=$MS_STORE_IDENTITY_NAME" "-c.appx.publisher=$MS_STORE_PUBLISHER" "-c.appx.publisherDisplayName=$MS_STORE_PUBLISHER_NAME"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: off-grid-ai-msix-${{ inputs.snap_release_tag }}
          path: dist/*.appx
          if-no-files-found: error
          compression-level: 0

      # Partner Center submission: beta goes to the beta package flight, stable to the public listing.
      # Lights up once the Store API secrets exist (MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID,
      # MS_STORE_CLIENT_SECRET, MS_STORE_SELLER_ID, MS_STORE_PRODUCT_ID; MS_STORE_BETA_FLIGHT_ID is optional, else the flight named Beta).
      - name: Set up the Microsoft Store CLI
        if: ${{ env.HAS_MS_STORE_API == 'true' }}
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to the Microsoft Store
        if: ${{ env.HAS_MS_STORE_API == 'true' }}
        shell: bash
        env:
          CHANNEL: ${{ inputs.snap_channel }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          MS_STORE_BETA_FLIGHT_ID: ${{ secrets.MS_STORE_BETA_FLIGHT_ID }}
        run: |
          msstore reconfigure --tenantId "$MS_STORE_TENANT_ID" --sellerId "$MS_STORE_SELLER_ID" \
            --clientId "$MS_STORE_CLIENT_ID" --clientSecret "$MS_STORE_CLIENT_SECRET"
          pkg=$(ls dist/*.appx | head -1)
          if [ "$CHANNEL" = stable ]; then
            msstore publish "$pkg" -id "$MS_STORE_PRODUCT_ID" -v
          else
            flight="$MS_STORE_BETA_FLIGHT_ID"
            if [ -z "$flight" ]; then
              # Partner Center does not show flight ids, so find the package flight named "Beta".
              token=$(curl -sf "https://login.microsoftonline.com/$MS_STORE_TENANT_ID/oauth2/token" \
                --data-urlencode grant_type=client_credentials --data-urlencode "client_id=$MS_STORE_CLIENT_ID" \
                --data-urlencode "client_secret=$MS_STORE_CLIENT_SECRET" --data-urlencode resource=https://manage.devcenter.microsoft.com \
                | jq -r .access_token)
              flight=$(curl -sf -H "Authorization: Bearer $token" \
                "https://manage.devcenter.microsoft.com/v1.0/my/applications/$MS_STORE_PRODUCT_ID/listflights" \
                | jq -r '.value[] | select(.friendlyName == "Beta") | .flightId' | head -1)
            fi
            [ -n "$flight" ] || { echo "::warning::No package flight named Beta: the beta MSIX stays an artifact."; exit 0; }
            msstore publish "$pkg" -id "$MS_STORE_PRODUCT_ID" -f "$flight" -v
          fi
